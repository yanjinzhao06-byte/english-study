<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>满分英语 · 河南专升本</title>
<meta name="description" content="从高考 50 分到河南专升本英语满分的系统学习计划：分级词汇、语法精讲、真题结构专项、全真模考与打卡统计。">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="满分英语">
<style>
/* ============================================================
   满分英语 · 设计系统 (大厂风格 / iPad 自适应 / 支持 PWA)
   ============================================================ */
:root{
  --brand:#4f46e5; --brand2:#7c3aed; --brand-soft:#eef0fe;
  --ink:#171a2e; --ink2:#454a63; --ink3:#8a8fa8;
  --line:#e6e8f2; --bg:#f4f5fb; --card:#ffffff;
  --ok:#0ea56a; --ok-soft:#e2f7ee;
  --warn:#f59e0b; --warn-soft:#fef4e0;
  --bad:#e5484d; --bad-soft:#fdecec;
  --info:#0ea5e9; --info-soft:#e3f4fd;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px;
  --sh-sm:0 1px 2px rgba(23,26,46,.05),0 4px 14px rgba(23,26,46,.05);
  --sh-md:0 6px 24px rgba(23,26,46,.08),0 2px 6px rgba(23,26,46,.05);
  --sh-lg:0 18px 50px rgba(23,26,46,.16);
  --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#a855f7 100%);
  --grad-soft:linear-gradient(135deg,#eef0fe,#f6f1fe);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); color:var(--ink); background:var(--bg);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit; font-size:15px; color:var(--ink)}
a{color:var(--brand); text-decoration:none}
b,strong{font-weight:700}
h1,h2,h3,h4{margin:0; line-height:1.35}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c9cde0; border-radius:8px}

/* ---------- 布局骨架 ---------- */
.app-root{display:flex; min-height:100vh}
.sidebar{
  width:250px; flex:0 0 250px; background:var(--card); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  padding:calc(10px + var(--safe-t)) 14px 14px; z-index:40;
}
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
  padding:calc(12px + var(--safe-t)) 22px 12px; background:rgba(244,245,251,.86);
  backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid rgba(230,232,242,.7);
}
.crumb{font-size:20px; font-weight:800; letter-spacing:.2px}
.top-right{margin-left:auto; display:flex; align-items:center; gap:10px}
.content{flex:1; padding:22px; max-width:1080px; width:100%; margin:0 auto}
.content:focus{outline:none}

.bottom-nav{display:none}

/* 品牌 */
.brand{display:flex; align-items:center; gap:11px; padding:6px 8px 18px; cursor:pointer}
.brand-logo{
  width:44px; height:44px; border-radius:13px; background:var(--grad); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px;
  box-shadow:0 6px 16px rgba(79,70,229,.35); flex:0 0 44px;
}
.brand-text{display:flex; flex-direction:column; line-height:1.25}
.brand-text b{font-size:17px; letter-spacing:.5px}
.brand-text small{color:var(--ink3); font-size:11px}

/* 侧栏导航 */
.side-nav{display:flex; flex-direction:column; gap:4px}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:13px;
  color:var(--ink2); font-weight:600; font-size:14.5px; transition:all .18s ease; text-align:left;
}
.nav-item .n-ico{font-size:19px; width:24px; text-align:center}
.nav-item:hover{background:#f0f1fa; color:var(--ink)}
.nav-item.active{background:var(--grad); color:#fff; box-shadow:0 8px 20px rgba(79,70,229,.3)}
.nav-item .n-badge{
  margin-left:auto; background:var(--bad); color:#fff; font-size:10.5px; font-weight:700;
  border-radius:99px; padding:1px 8px; min-width:18px; text-align:center;
}
.nav-item.active .n-badge{background:rgba(255,255,255,.92); color:var(--brand)}
.side-foot{margin-top:auto; padding-top:12px}
.mini-card{background:var(--grad-soft); border:1px solid #e4e1fb; border-radius:16px; padding:12px 14px; font-size:13px; color:var(--ink2)}

.icon-btn{
  width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:18px; background:var(--card); border:1px solid var(--line); color:var(--ink2);
  box-shadow:var(--sh-sm); transition:all .15s ease;
}
.icon-btn:hover{color:var(--brand); border-color:#cfd0f5; transform:translateY(-1px)}
.menu-btn{display:none}
.score-pill{
  display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line);
  border-radius:99px; padding:6px 14px; font-weight:800; font-size:14px; box-shadow:var(--sh-sm); color:var(--brand);
}
.score-pill small{color:var(--ink3); font-weight:600}

/* ---------- 通用元素 ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh-sm)}
.pad{padding:20px}
.row{display:flex; align-items:center; gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1; min-width:0}
.muted{color:var(--ink3)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.center{text-align:center}
.hr{border:none; border-top:1px solid var(--line); margin:16px 0}

/* 按钮 */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--grad); color:#fff; font-weight:700; border-radius:14px; padding:12px 22px;
  font-size:15px; box-shadow:0 8px 20px rgba(79,70,229,.28); transition:all .16s ease; border:none;
  min-height:46px;
}
.btn:hover{transform:translateY(-1px); box-shadow:0 12px 26px rgba(79,70,229,.36)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
.btn.block{width:100%}
.btn.ghost{background:var(--card); color:var(--brand); border:1.5px solid #d5d6f4; box-shadow:none}
.btn.ghost:hover{border-color:var(--brand)}
.btn.soft{background:var(--brand-soft); color:var(--brand); box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#0ea56a,#12b981); box-shadow:0 8px 20px rgba(14,165,106,.25)}
.btn.bad{background:linear-gradient(135deg,#e5484d,#f2555a); box-shadow:0 8px 20px rgba(229,72,77,.22)}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#fbbf24); color:#5b3a00; box-shadow:0 8px 20px rgba(245,158,11,.25)}
.btn.sm{padding:8px 14px; min-height:36px; border-radius:11px; font-size:13.5px}
.btn.xs{padding:5px 11px; min-height:30px; border-radius:9px; font-size:12.5px; box-shadow:none}
.btn.plain{background:none; color:var(--ink2); box-shadow:none; font-weight:600}
.btn.plain:hover{color:var(--brand); background:#f0f1fa}

/* 徽章/标签 */
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:99px;
  background:#f1f2f9; color:var(--ink2); font-size:12px; font-weight:600;
}
.chip.brand{background:var(--brand-soft); color:var(--brand)}
.chip.ok{background:var(--ok-soft); color:var(--ok)}
.chip.warn{background:var(--warn-soft); color:#b07a07}
.chip.bad{background:var(--bad-soft); color:var(--bad)}
.chip.info{background:var(--info-soft); color:var(--info)}
.tag{display:inline-block; padding:2px 9px; border-radius:8px; font-size:11.5px; font-weight:700}

/* 网格 */
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g-auto2{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

/* 进度条 */
.pbar{height:8px; background:#eceef7; border-radius:99px; overflow:hidden}
.pbar>i{display:block; height:100%; border-radius:99px; background:var(--grad); transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pbar.thin{height:5px}
.pbar.ok>i{background:linear-gradient(90deg,#0ea56a,#12b981)}

/* 统计卡 */
.stat-card{padding:16px 18px; position:relative; overflow:hidden}
.stat-card .k{font-size:12.5px; color:var(--ink3); font-weight:600; display:flex; align-items:center; gap:6px}
.stat-card .v{font-size:26px; font-weight:800; margin-top:6px; letter-spacing:-.5px}
.stat-card .v small{font-size:13px; color:var(--ink3); font-weight:600}
.stat-card .e{font-size:12px; color:var(--ok); font-weight:700}

/* 环形图 */
.ring{--p:0; position:relative; width:150px; height:150px; border-radius:50%;
  background:conic-gradient(var(--brand) calc(var(--p)*1%), #eceef7 0);
  display:flex; align-items:center; justify-content:center}
.ring::before{content:""; position:absolute; inset:12px; background:var(--card); border-radius:50%; box-shadow:inset 0 0 0 1px var(--line)}
.ring .ring-txt{position:relative; text-align:center; z-index:1}
.ring .ring-txt b{font-size:26px; letter-spacing:-.5px}
.ring.sm{width:112px; height:112px}
.ring.sm::before{inset:9px}

/* 首页问候 & 打卡 */
.hero{
  background:var(--grad); color:#fff; border-radius:var(--r-xl); padding:22px 24px;
  position:relative; overflow:hidden; box-shadow:0 16px 40px rgba(79,70,229,.32);
}
.hero::after{content:""; position:absolute; right:-60px; top:-80px; width:220px; height:220px; border-radius:50%;
  background:rgba(255,255,255,.14)}
.hero::before{content:""; position:absolute; right:60px; bottom:-110px; width:190px; height:190px; border-radius:50%;
  background:rgba(255,255,255,.08)}
.hero h1{font-size:21px}
.hero p{margin:6px 0 0; opacity:.92; font-size:13.5px}
.checkin-hero{display:flex; align-items:center; gap:14px}
.checkin-btn{
  width:64px; height:64px; border-radius:20px; flex:0 0 64px; background:rgba(255,255,255,.16);
  border:1.6px dashed rgba(255,255,255,.65); font-size:28px; transition:all .18s;
  backdrop-filter:blur(4px);
}
.checkin-btn.done{background:#fff; border-style:solid; color:var(--brand)}
.checkin-btn:hover{transform:scale(1.06)}
.flame{font-size:34px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}

/* 动作卡 */
.act-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px;
  display:flex; gap:14px; align-items:flex-start; cursor:pointer; transition:all .18s ease; box-shadow:var(--sh-sm); text-align:left; width:100%;
}
.act-card:hover{transform:translateY(-2px); box-shadow:var(--sh-md); border-color:#d9dbf7}
.act-card .ico{
  width:46px; height:46px; border-radius:14px; flex:0 0 46px; display:flex; align-items:center;
  justify-content:center; font-size:22px; background:var(--brand-soft);
}
.act-card .ico.g1{background:var(--grad); color:#fff; box-shadow:0 6px 14px rgba(79,70,229,.3)}
.act-card .ico.g2{background:linear-gradient(135deg,#0ea5e9,#22d3ee); color:#fff; box-shadow:0 6px 14px rgba(14,165,233,.28)}
.act-card .ico.g3{background:linear-gradient(135deg,#f59e0b,#fb923c); color:#fff; box-shadow:0 6px 14px rgba(245,158,11,.28)}
.act-card .ico.g4{background:linear-gradient(135deg,#0ea56a,#34d399); color:#fff; box-shadow:0 6px 14px rgba(14,165,106,.26)}
.act-card b{font-size:15.5px; display:block}
.act-card p{margin:3px 0 0; font-size:12.5px; color:var(--ink3)}
.act-card .arrow{margin-left:auto; color:#c6c9dd; font-size:18px; align-self:center}

/* 学习路径 */
.phase{display:flex; gap:0; position:relative}
.phase .p-node{flex:1; min-width:0; text-align:center; position:relative}
.phase .p-line{position:absolute; left:0; right:0; top:17px; height:4px; background:#e8eaf5; border-radius:4px}
.phase .p-dot{width:34px; height:34px; border-radius:50%; background:#fff; border:4px solid #dcdef0;
  display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:var(--ink3); position:relative; z-index:1}
.phase .p-dot.on{background:var(--grad); border-color:#dcd3ff; color:#fff; box-shadow:0 4px 12px rgba(79,70,229,.4)}
.phase .p-dot.pass{border-color:#bfe7d4; background:var(--ok-soft); color:var(--ok)}
.phase .p-name{font-size:12px; font-weight:700; margin-top:8px}
.phase .p-goal{font-size:11px; color:var(--ink3)}

/* 热力图 */
.heat{display:flex; gap:3px; overflow-x:auto; padding-bottom:4px}
.heat .col{display:flex; flex-direction:column; gap:3px}
.heat .cell{width:13px; height:13px; border-radius:3.5px; background:#eceef7}
.heat .cell.l1{background:#d9defc}.heat .cell.l2{background:#a5b0f6}
.heat .cell.l3{background:#6d78e8}.heat .cell.l4{background:#4338ca}
.heat .cell.today{outline:1.6px solid var(--bad); outline-offset:1px}
.heat-legend{display:flex; gap:4px; align-items:center; font-size:11px; color:var(--ink3)}

/* 单词卡片 */
.word-card{
  background:var(--card); border-radius:var(--r-xl); box-shadow:var(--sh-md);
  padding:34px 26px; text-align:center; min-height:320px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line);
}
.word-card .w-en{font-size:42px; font-weight:800; letter-spacing:.3px; word-break:break-word}
.word-card .w-meta{color:var(--brand); font-weight:700; font-size:14px}
.word-card .w-def{font-size:19px; font-weight:600; color:var(--ink); max-width:560px}
.word-card .w-eg{color:var(--ink3); font-size:13.5px; font-style:italic; margin-top:6px}
.flash-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.flash-actions .btn{min-width:110px}

/* 测验/练习 */
.qz-stem{font-size:16.5px; font-weight:700; line-height:1.7}
.qz-option{
  display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--card);
  border:1.6px solid var(--line); border-radius:15px; padding:13px 16px; font-size:15px; transition:all .15s;
}
.qz-option:hover{border-color:#b9bcef; background:#fafaff}
.qz-option .letter{width:26px; height:26px; border-radius:9px; background:#f1f2f9; color:var(--ink2);
  font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex:0 0 26px}
.qz-option .let-A{background:var(--info-soft); color:var(--info)}
.qz-option .let-B{background:var(--ok-soft); color:var(--ok)}
.qz-option .let-C{background:var(--warn-soft); color:#b07a07}
.qz-option .let-D{background:var(--bad-soft); color:var(--bad)}
.qz-option.sel{border-color:var(--brand); background:var(--brand-soft)}
.qz-option.sel .letter{background:var(--brand); color:#fff}
.qz-option.right{border-color:var(--ok); background:var(--ok-soft)}
.qz-option.right .letter{background:var(--ok); color:#fff}
.qz-option.wrong{border-color:var(--bad); background:var(--bad-soft)}
.qz-option.wrong .letter{background:var(--bad); color:#fff}
.qz-option:disabled{cursor:default}
.qz-exp{background:#fafbff; border-left:3.5px solid var(--brand); padding:12px 14px; border-radius:0 12px 12px 0; font-size:13.5px}
.progress-line{display:flex; align-items:center; gap:12px}
.qlabel{font-size:12px; color:var(--ink3); font-weight:700; white-space:nowrap}

/* 阅读/文章样式 */
.article{font-size:15.5px; line-height:1.95; color:#23263c}
.article p{margin:0 0 12px}
.reading-pane{background:#fbfcff; border:1px solid var(--line); border-radius:16px; padding:18px; max-height:46vh; overflow:auto}
.blanks-sent{font-size:15px; line-height:2.1}
.blank{display:inline-flex; align-items:center; min-width:74px; border-bottom:2px dashed var(--brand);
  margin:0 3px; padding:0 6px; font-weight:700; color:var(--brand); background:var(--brand-soft); border-radius:6px 6px 0 0; min-height:28px}
.blank.sel-box{border-color:var(--warn); background:var(--warn-soft); color:#b07a07}
.blank.filled{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.word-sel{background:#fff; border:1.5px solid var(--line); border-radius:99px; padding:6px 14px; font-size:14px; font-weight:600; transition:all .12s}
.word-sel:hover{border-color:var(--brand); color:var(--brand)}
.word-sel.used{opacity:.32; text-decoration:line-through; cursor:not-allowed}

/* 语法课 */
.lesson-block .sec-t{font-size:15px; font-weight:800; color:var(--brand); margin:18px 0 8px; display:flex; gap:8px; align-items:center}
.gram-box{background:#fbfcff; border:1px solid var(--line); border-left:4px solid var(--brand); border-radius:12px; padding:14px 16px}
.eg{color:#2c3050; background:#fff; border:1px dashed #d8daf0; border-radius:10px; padding:10px 13px; margin:8px 0; font-size:14.5px}
.eg .zh{color:var(--ink3); font-size:12.5px; display:block}
.hl{color:var(--bad); font-weight:700}

/* 结果页 */
.result-hero{padding:30px; text-align:center; background:var(--grad); color:#fff; border-radius:var(--r-xl)}
.big-num{font-size:54px; font-weight:800; letter-spacing:-1px}
.section-score{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}

/* 表格 */
.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th{color:var(--ink3); font-weight:700; text-align:left; padding:8px 10px; border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px; border-bottom:1px solid #f0f1f8}

/* 空状态 */
.empty{text-align:center; padding:44px 20px; color:var(--ink3)}
.empty .big{font-size:44px; margin-bottom:8px}

/* 弹层 & Toast */
.modal-mask{
  position:fixed; inset:0; background:rgba(23,26,46,.45); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  animation:fade .16s ease;
}
.modal{background:#fff; border-radius:24px; max-width:520px; width:100%; max-height:86vh; overflow:auto;
  box-shadow:var(--sh-lg); animation:pop .2s cubic-bezier(.2,.9,.3,1.2); padding:24px}
.toast-wrap{position:fixed; left:0; right:0; bottom:calc(26px + var(--safe-b)); display:flex; flex-direction:column;
  align-items:center; gap:8px; z-index:200; pointer-events:none}
.toast{
  background:#1c1f33; color:#fff; border-radius:99px; padding:10px 20px; font-size:14px; font-weight:600;
  box-shadow:var(--sh-lg); animation:pop .22s ease; max-width:86vw; text-align:center;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.97)}to{opacity:1; transform:none}}
@keyframes slideUp{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:none}}
.screen-anim{animation:slideUp .26s cubic-bezier(.2,.8,.2,1)}

/* 小组件 */
.li-item{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid #f2f3fa}
.li-item:last-child{border-bottom:none}
.li-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--brand-soft); font-size:18px; flex:0 0 38px}
.li-txt{font-size:13.5px;font-weight:600}
.li-sub{font-size:12px;color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.divider{width:1px;height:14px;background:var(--line)}
.clock{font-family:var(--mono); font-weight:800; font-variant-numeric:tabular-nums}

/* Mock 布局 */
.mock-quiz{max-width:820px; margin:0 auto}
.sec-tag{font-size:12px; font-weight:800; color:var(--brand); background:var(--brand-soft);
  padding:4px 12px; border-radius:99px; display:inline-flex; align-items:center; gap:6px}
.answer-sheet{position:sticky; bottom:calc(8px + var(--safe-b)); background:#fff; border:1px solid var(--line);
  border-radius:16px; box-shadow:var(--sh-md); padding:10px 14px; display:flex; gap:10px; align-items:center; z-index:20; margin-top:14px}
.sheet-dots{display:flex; gap:6px; flex-wrap:wrap; overflow-x:auto; max-height:74px}
.sdot{width:26px;height:26px;border-radius:8px;font-size:11px;font-weight:800;display:flex;align-items:center;
  justify-content:center;background:#f1f2f9;color:var(--ink2);flex:0 0 26px}
.sdot.on{border:2px solid var(--brand); color:var(--brand)}
.sdot.ans{background:var(--ok-soft); color:var(--ok)}
.sdot.cur{outline:2px solid var(--warn)}

/* 输入 */
.inp,textarea.inp{
  width:100%; border:1.6px solid var(--line); border-radius:13px; padding:12px 14px; background:#fff;
  outline:none; transition:border .15s; resize:vertical;
}
.inp:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.inp.err{border-color:var(--bad)}

/* 成就 */
.badge-item{display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 6px; text-align:center}
.badge-item .b-ico{width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:25px; background:var(--grad-soft); border:1px solid #e4e1fb}
.badge-item.locked{opacity:.4; filter:grayscale(.7)}
.badge-item b{font-size:12px}
.badge-item small{font-size:10.5px; color:var(--ink3); line-height:1.3}

/* 列表分节标题 */
.sect{display:flex; align-items:center; gap:10px; margin:26px 0 12px}
.sect h3{font-size:17px}
.sect::after{content:""; flex:1; height:1px; background:var(--line)}

/* ---------- 响应式 ---------- */
@media (max-width:1023px){
  .sidebar{display:none}
  .menu-btn{display:flex}
  .content{padding:16px; max-width:none}
  .crumb{font-size:17px}
}
@media (min-width:1024px){
  .bottom-nav{display:none !important}
}
@media (max-width:1023px){
  .bottom-nav{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:rgba(255,255,255,.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line); padding:6px 6px calc(6px + var(--safe-b));
    justify-content:space-around;
  }
  .b-item{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:var(--ink3);
    font-weight:600; padding:4px 10px; border-radius:12px; flex:1; max-width:76px}
  .b-item .bi{font-size:21px; line-height:1.2}
  .b-item.active{color:var(--brand)}
  .b-item.active .bi{transform:translateY(-1px)}
  body{padding-bottom:calc(58px + var(--safe-b))}
}
@media (max-width:640px){
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .content{padding:12px}
  .word-card{padding:26px 16px; min-height:280px}
  .word-card .w-en{font-size:32px}
  .hero{padding:18px}
  .flash-actions .btn{min-width:94px; padding:10px 12px}
  .topbar{padding-left:14px; padding-right:14px}
}
@media (min-width:1200px){ .content{max-width:1180px} }

/* 打印友好（作文范文等） */
@media print{
  .sidebar,.topbar,.bottom-nav,.toast-wrap{display:none !important}
  body{background:#fff}
}

<script>/* ==== data-course ==== *//* ============================================================

   课: { id, lv, title, est, blocks:[{k:'p'|'eg'|'tip', ...}], qs:[{q,o,a,e}] }
   ============================================================ */
(function (g) {
  var C = { levels: [
    { lv: 1, name: 'A · 基础语法重建', desc: '对应 50→80 分阶段', color: '#0ea5e9' },

    { lv: 3, name: 'C · 专升本拔高语法', desc: '对应 110→150 分阶段', color: '#7c3aed' }
  ], list: [] };
  function lesson(o){ C.list.push(o); return o; }

  /* ============ A 基础 ============ */
  lesson({
    id: 'A1', lv: 1, title: '名词：可数与不可数', est: '12 分钟',
    blocks: [
      { k: 'p', x: '专升本考点中名词主要考三点：①可数/不可数；②单复数变化；③名词所有格。先把最常见的“永远不可数”名词背下来：advice、information、news、homework、furniture、equipment、progress、knowledge、weather、traffic。它们不能直接加 a/an 或 -s，要表达数量用 a piece of … 等量词。' },
      { k: 'p', x: '②常考不规则复数：man→men，woman→women，child→children，tooth→teeth，foot→feet，mouse→mice。外来词复数：analysis→analyses（分析），crisis→crises（危机），phenomenon→phenomena（现象），medium→media（媒体），datum→data（数据）。' },
      { k: 'eg', en: 'Can you give me some advice on how to learn English?', zh: '你能给我一些学英语的建议吗？（advice 不可数，无复数）' },
      { k: 'eg', en: 'Many women teachers attended the meeting.', zh: '许多女教师参加了会议。（man/woman 修饰复数名词时也变复数）' },
      { k: 'tip', x: '看到选项里出现 informations / advices / furnitures 直接排除——考试最爱用“假复数”做干扰项。' }
    ],
    qs: [
      { q: 'Would you like some ___ about the trip?', o: ['advices', 'advice', 'an advice', 'the advices'], a: 1, e: 'advice 不可数，不能加 -s，也不能加 a/an。' },
      { q: 'All the ___ in our school will have a meeting tomorrow.', o: ['woman teachers', 'women teachers', 'women teacher', 'woman teacher'], a: 1, e: 'man / woman 作定语修饰复数名词时，本身也要变复数。' },
      { q: 'Two ___ and three ___ visited our school last week.', o: ['Germans; Japanese', 'German; Japanese', 'Germans; Japaneses', 'German; Japaneses'], a: 0, e: 'German 的复数是 Germans；Japanese 单复数同形。' },
      { q: 'He has collected a great deal of ___ about the accident.', o: ['informations', 'information', 'an information', 'information pieces'], a: 1, e: 'information 不可数；表示“一条信息”用 a piece of information。' }
    ]
  });
  lesson({
    id: 'A2', lv: 1, title: '冠词 a / an / the', est: '12 分钟',
    blocks: [
      { k: 'p', x: '① a / an 用于泛指单数可数名词：a 后接辅音音素开头，an 后接元音音素开头。注意是“音素”不是字母：an hour（h 不发音）、an honest boy；a university / a useful book（u 读 /ju:/ 为辅音开头）。' },
      { k: 'p', x: '② the 用于特指：上文提到过的人或物、独一无二的事物（the sun）、江河湖海山脉（the Yellow River）、乐器前（play the piano）、形容词最高级与序数词前（the best、the first）。' },
      { k: 'p', x: '③ 零冠词：三餐（have breakfast）、球类/棋类运动（play basketball）、by+交通工具（by bus）、学科、语言前一般不加 the。但若有后置定语特指时又要加 the，如 the breakfast today。' },
      { k: 'eg', en: 'He is an honest boy and the tallest student in his class.', zh: '他是个诚实的男孩，也是班里最高的学生。（honest 的 h 不发音，用 an）' },
      { k: 'tip', x: '判断口诀：泛指单数看“音素”，特指唯一用 the，三餐球类学科语言不用冠词。' }
    ],
    qs: [
      { q: 'He is ___ honest boy and ___ best student in our class.', o: ['a; the', 'an; the', 'an; a', 'the; a'], a: 1, e: 'honest 以元音音素开头用 an；最高级前加 the。' },
      { q: '___ Changjiang River is one of ___ longest rivers in the world.', o: ['The; the', '/; the', 'The; /', '/; /'], a: 0, e: '江河名称前加 the；最高级前加 the。' },
      { q: 'I usually have ___ breakfast at home, but ___ breakfast today was special.', o: ['/; the', 'the; the', 'a; the', '/; a'], a: 0, e: '泛指三餐不加冠词；后有 today 特指，加 the。' },
      { q: 'She plays ___ piano well but dislikes playing ___ basketball.', o: ['the; /', 'the; the', '/; the', '/; /'], a: 0, e: '乐器前加 the，球类运动前不加冠词。' }
    ]
  });
  lesson({
    id: 'A3', lv: 1, title: '代词：人称·物主·反身·不定', est: '14 分钟',
    blocks: [
      { k: 'p', x: '① 人称代词：作主语用主格（I/he/she），作宾语用宾格（me/him/her）。② 物主代词：my/mine 的区别——my 后必须跟名词（my book），mine 独立使用（This book is mine）。' },
      { k: 'p', x: '③ 反身代词 myself/yourself/himself…：用于 by oneself（独自）、enjoy oneself（玩得开心）、help oneself to（随便吃）、dress oneself 等固定搭配。④ 不定代词：some/any——some 用于肯定句与“请求建议”的疑问句；any 用于否定和一般疑问句。' },
      { k: 'p', x: '⑤ 比较句中的替代：The weather here is warmer than that of Beijing.（that 代替不可数/单数名词，those 代替复数名词。）' },
      { k: 'eg', en: 'Help yourself to some fish, please.', zh: '请随便吃点鱼。（help oneself to 固定搭配）' },
      { k: 'eg', en: 'The population of China is larger than that of Japan.', zh: '中国的人口比日本的多。（that 代替 the population）' },
      { k: 'tip', x: '一句话内出现两个相同名词时，第二个用 that/those/one 代替；不可数与单数用 that，复数用 those。' }
    ],
    qs: [
      { q: 'My phone is broken. May I use ___?', o: ['your', 'yours', 'you', 'yourself'], a: 1, e: '空格后无名词，用名词性物主代词 yours。' },
      { q: 'I can’t carry the box by ___, so I asked Tom for help.', o: ['me', 'my', 'myself', 'mine'], a: 2, e: 'by oneself 独自、靠自己。' },
      { q: 'Would you like ___ to drink?', o: ['something', 'anything', 'everything', 'nothing'], a: 0, e: '表示请求、建议并希望得到肯定答复时用 something。' },
      { q: 'The weather in Zhengzhou is colder than ___ in Guangzhou in winter.', o: ['it', 'that', 'one', 'those'], a: 1, e: 'that 代替前面提到的不可数名词 the weather。' }
    ]
  });
  lesson({
    id: 'A4', lv: 1, title: '形容词与副词：比较级', est: '14 分钟',
    blocks: [
      { k: 'p', x: '① 规则变化：单音节与部分双音节加 -er/-est；多音节与 -ly 副词前加 more/most（important→more important）。② 不规则：good/well→better→best；bad/badly→worse→worst；many/much→more→most；little→less→least；far→farther/further。' },
      { k: 'p', x: '③ 常见句型：A is + 比较级 + than B；The + 比较级, the + 比较级（越…越…）；比较级 + and + 比较级（越来越…）；one of the + 最高级 + 复数名词；比较级前可用 much / even / a lot / a little 修饰，不能用 very 或 more 叠用。' },
      { k: 'eg', en: 'The harder you work, the greater progress you will make.', zh: '你越努力，取得的进步就越大。' },
      { k: 'eg', en: 'This problem is much more difficult than that one.', zh: '这道题比那道难得多。（much 修饰比较级）' },
      { k: 'tip', x: '看到 more better、more easier 这类“双重比较”直接排除。' }
    ],
    qs: [
      { q: 'Of the two shirts, this one is the ___ of the two.', o: ['cheapest', 'cheaper', 'more cheap', 'most cheap'], a: 1, e: '两者比较用比较级，且“the + 比较级 + of the two”是固定表达。' },
      { q: 'She sings ___ than any other student in her class.', o: ['much well', 'much better', 'more better', 'very better'], a: 1, e: 'much 修饰比较级；more better 双重比较是错的。' },
      { q: 'The ___ you work, the ___ progress you will make.', o: ['harder; more', 'more hard; more', 'harder; greater', 'more harder; greater'], a: 0, e: 'the + 比较级，the + 比较级 表示“越…越…”。' },
      { q: 'He was ___ tired ___ he couldn’t walk on.', o: ['so; that', 'such; that', 'too; to', 'enough; to'], a: 0, e: 'so…that… 如此…以至于…，后接从句。' }
    ]
  });
  lesson({
    id: 'A5', lv: 1, title: '介词与连词', est: '14 分钟',
    blocks: [
      { k: 'p', x: '介词主要考固定搭配，先掌握最常考的：be popular with（受欢迎）、be strict with sb / in sth、be good at、be proud of、be afraid of、be interested in、be busy with、worry about、believe in、depend on、look forward to、take part in、pay attention to、be familiar with / be familiar to。' },
      { k: 'p', x: '连词按逻辑关系记忆：并列 and/or/but；因果 so/because（because 后接从句，because of 后接名词）；转折 but/however；时间 when/while/as soon as/until/since；条件 if/unless；让步 although/though（不能和 but 连用）。' },
      { k: 'eg', en: 'She is popular with her classmates because she is kind.', zh: '她在同学中很受欢迎，因为她很善良。（注意 because 与 because of 的搭配）' },
      { k: 'eg', en: 'Although it rained heavily, they went on working.', zh: '尽管雨下得很大，他们仍然继续工作。（although 不与 but 连用）' },
      { k: 'tip', x: 'although/though 与 but、because 与 so 不能在同一句同时出现，这是改错题高频考点。' }
    ],
    qs: [
      { q: 'The young teacher is very popular ___ her students.', o: ['to', 'with', 'for', 'at'], a: 1, e: 'be popular with 受…欢迎。' },

      { q: 'Don’t worry ___ your exam. I believe ___ you.', o: ['about; in', 'for; on', 'with; of', 'at; for'], a: 0, e: 'worry about 担心；believe in 信任。' },
      { q: '___ he is very young, ___ he knows a lot about computers.', o: ['Although; but', 'Although; /', 'Because; so', 'If; then'], a: 1, e: 'although 与 but 不能连用，只能用一个。' }
    ]
  });
  lesson({
    id: 'A6', lv: 1, title: '基础时态：现在·过去·将来·进行', est: '16 分钟',

<script>/* ==== engine ==== *//* ============================================================
   纯逻辑引擎：打卡/连击 / SRS 记忆 / 随机组卷 / 预估分 / 成长路径
   不依赖 DOM，可在 Node 中单测
   ============================================================ */
(function (g) {
  'use strict';
  var E = {};

  /* ---------- 日期工具 ---------- */
  E.pad = function (n) { return (n < 10 ? '0' : '') + n; };
  E.dateKey = function (d) {
    d = d || new Date();
    return d.getFullYear() + '-' + E.pad(d.getMonth() + 1) + '-' + E.pad(d.getDate());
  };
  E.parseKey = function (k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
  E.addDays = function (d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; };
  E.dayKey = function (offset) { return E.dateKey(E.addDays(new Date(), offset)); };
  E.diffDays = function (a, b) {
    var ms = E.parseKey(a).getTime() - E.parseKey(b).getTime();
    return Math.round(ms / 86400000);
  };

  /* 连续打卡：今天有记录则含今天；否则从昨天向前数 */
  E.streak = function (days, today) {
    today = today || E.dateKey();
    var total = 0, off = days[today] ? 0 : -1;
    for (var k = 0; k < 4000; k++) {
      if (!days[E.dayKey(off)]) break;
      total++;
      off = off - 1;
    }
    return total;
  };

  /* ---------- 随机 ---------- */
  E.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  E.pick = function (arr, n) { return E.shuffle(arr).slice(0, n); };
  /* 随机打乱选择题选项，返回 { os: 打乱后选项, ai: 正确项新下标 } */
  E.shufChoices = function (o, a) {
    var idx = o.map(function (_, i) { return i; });
    var s = E.shuffle(idx);
    var os = s.map(function (i) { return o[i]; });
    var ai = s.indexOf(a);
    return { os: os, ai: ai };
  };
  E.clamp = function (x, lo, hi) { return Math.max(lo, Math.min(hi, x)); };

  /* ---------- SRS（简化版 SM-2） ----------
     word = { b: 记忆盒 0-6, due: 到期毫秒时间戳, ok: 正确次数, ng: 忘记次数 }
     grade: 2 认识 / 1 模糊 / 0 忘记   */
  E.SRS_INTERVALS = [1, 2, 4, 7, 15, 30, 45]; // 对应盒子 0-6 成功后间隔天数
  E.srsApply = function (word, grade) {
    var w = { b: word.b || 0, due: word.due || 0, ok: word.ok || 0, ng: word.ng || 0 };
    var now = Date.now(), day = 86400000;
    if (grade === 2) { // 认识
      w.b = Math.min(6, w.b + 1); w.ok++;
      if (w.b === 0) w.b = 1; // 首次认识升到盒子1
      w.due = now + E.SRS_INTERVALS[w.b] * day;
    } else if (grade === 1) { // 模糊：盒位不变，次日再见
      w.ng++;
      if (w.b === 0) { w.b = 0; }
      w.due = now + 1 * day;
    } else { // 忘记：回到盒 0，明天复习
      w.b = 0; w.ng++; w.due = now + 1 * day;
    }
    return w;
  };
  E.wordKnown = function (w) { return w && w.b >= 1; };
  E.wordDue = function (w, now) { return w && w.due && w.due <= (now || Date.now()); };

  /* ---------- 预估分模型（0-150，向 150 收敛） ---------- */
  E.estimate = function (S) {
    var V = S.vocab || {}, totalWords = (g.ED && g.ED.vocab && g.ED.vocab.total) || 430;
    var known = 0, due = 0;
    Object.keys(V).forEach(function (id) {
      var w = V[id];
      if (E.wordKnown(w)) known++;
      if (w.b > 0 && E.wordDue(w)) due++;
    });
    var lessons = (g.ED && g.ED.course && g.ED.course.list) || [];
    var doneL = Object.keys(S.lessons || {}).filter(function (k) { return S.lessons[k].done; }).length;
    var stat = S.stats || {};
    var attempts = stat.qn || 0, okQ = stat.qk || 0;
    var acc = attempts ? okQ / attempts : 0;

    // 词汇(掌握度→40，按专升本现实目标约 1600 词封顶)、语法(完成度→20)、练习(量×正确率→30)
    var wordDen = Math.min(totalWords, 1600);
    var wordP = E.clamp(known / wordDen, 0, 1) * 40;
    var gramP = lessons.length ? (doneL / lessons.length) * 20 : 0;
    var pracVol = E.clamp(attempts / 240, 0, 1);
    var pracP = acc * pracVol * 30;
    var base = wordP + gramP + pracP;

    // 摸底测诊断基线：预估分不低于诊断起点，学习证据(词汇/语法/练习)超过则取更高
    var diag = S.diag ? S.diag.score : 40;
    var score = Math.max(diag, base);

    // 模考直接证据（权重最高）
    var mocks = S.mocks || [];
    if (mocks.length) {
      var best = 0, sum = 0;
      mocks.forEach(function (m) { best = Math.max(best, m.total); sum += m.total; });
      var avg = sum / mocks.length;
      var evid = Math.max(avg * 0.65 + best * 0.35, best * 0.8);
      score = Math.max(score, evid);
    }
    return Math.round(E.clamp(score, 0, 150));
  };

  /* ---------- 成长路径 ---------- */
  E.PHASES = [
    { i: 0, name: 'P1 基础重建', range: '50 → 80', color: '#0ea5e9',
      goal: '打牢词法与基础词汇',
      focus: '冠词·代词·时态入门 · 基础 1200 词 · 每天 20 新词',
      tasks: ['完成 Tier1「基础重建」词书一轮', '学完 A 系列 6 节语法课', '掌握一般现在/过去/将来/进行时', '每日打卡 ≥ 20 天', '第一次完整模考 ≥ 90 分'] },
    { i: 1, name: 'P2 核心突破', range: '80 → 110', color: '#0ea56a',
      goal: '高中核心语法 + 题型入门',
      focus: '完成时·被动·从句 · 高中核心词 · 阅读精练',
      tasks: ['Tier2 高中核心词达到 80% 掌握', '学完 B 系列 6 节语法课', '阅读精练 30 篇+', '完形/判断正误正确率 ≥ 75%', '模考稳定 100+'] },
    { i: 2, name: 'P3 进阶强化', range: '110 → 135', color: '#f59e0b',
      goal: '专升本结构全题型专项',
      focus: '虚拟·倒装·非谓语 · 高频词 · 翻译改错专项',
      tasks: ['Tier3 高频词一轮', '学完 C 系列 6 节拔高课', '汉译英/改错专项 ≥ 85%', '选词填空 / 英译汉专项', '全真模考 2 次+，目标 120+'] },
    { i: 3, name: 'P4 满分冲刺', range: '135 → 150', color: '#e5484d',
      goal: '查漏补缺 · 冲击满分',
      focus: '错题复盘 · 作文亮点句 · 全真模考节奏',
      tasks: ['全部词书滚动复习到期清零', '薄弱语法点重学(错题驱动)', '作文 5 篇+ 亮点句运用', '模考 ≥ 3 次目标 140+', '限时训练：150 分钟节奏感'] }
  ];
  E.phaseOf = function (score) {
    if (score < 80) return 0;
    if (score < 110) return 1;
    if (score < 135) return 2;
    return 3;
  };

  /* ---------- 热力图数据：最近 20 周 ---------- */
  E.heatmap = function (days) {
    var today = E.dateKey();
    var weeks = [];
    // 从周日开始的当前周
    var d = new Date();
    var dow = (d.getDay() + 6) % 7; // 周一为 0
    var start = E.addDays(d, -dow - 6 * 19); // 往前推 19 周+本周
    for (var w = 0; w < 20; w++) {
      var col = [];
      for (var i = 0; i < 7; i++) {
        var k = E.dateKey(E.addDays(start, w * 7 + i));
        var v = days[k];
        var lvl = 0;
        if (v) {
          var act = (v.w || 0) + ((v.sec || 0) / 60) + (v.qn || 0) + (v.tasks || 0);
          if (v.manual) act = Math.max(act, 1);
          if (act > 0) lvl = 1;
          if (act >= 3) lvl = 2;
          if (act >= 8) lvl = 3;
          if (act >= 15) lvl = 4;
        }
        if (k > today) lvl = -1; // 未来
        col.push({ k: k, lvl: lvl, today: k === today });
      }
      weeks.push(col);
    }
    return weeks;
  };

  g.Engine = E;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ==== core ==== *//* ============================================================
   应用核心：状态、路由、打卡、学习计时、全局事件  window.Eng

(function (g) {

  /* ---------------- 状态 ---------------- */

      days: {},       // 'YYYY-MM-DD': {sec,w,r,qn,qk,tasks,mocks,manual,acts:[{t,d}]}
      vocab: {},      // wordIdx: {b,due,ok,ng}
      lessons: {},    // lessonId: {done,best,at}
      stats: { wNew: 0, reviews: 0, qn: 0, qk: 0, tasks: 0, mocksDone: 0 },
      mocks: [],      // {at, auto, total, max, type}
      diag: null,     // {score, at}
      badges: {}      // id: at
    };
  }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) {
      try { var o = JSON.parse(raw); if (o && o.v === 1) return o; } catch (e) { /* 损坏则重建 */ }
    }
    return defaults();
  }
  Eng.save = function () {
    try { localStorage.setItem(KEY, JSON.stringify(Eng.S)); } catch (e) { /* 空间不足忽略 */ }
  };
  Eng.exportData = function () { return JSON.stringify(Eng.S); };
  Eng.importData = function (txt) {
    var o = JSON.parse(txt);
    if (!o || o.v !== 1) throw new Error('文件格式不正确');
    Eng.S = o; Eng.save();
    return true;
  };
  Eng.resetAll = function () { Eng.S = defaults(); Eng.save(); };

  /* ---------------- 今日记录 ---------------- */
  Eng.today = function () { return E.dateKey(); };
  Eng.record = function (o) {
    var dk = Eng.today();
    var d = Eng.S.days[dk] || (Eng.S.days[dk] = { sec: 0, w: 0, r: 0, qn: 0, qk: 0, tasks: 0, mocks: 0, acts: [] });
    var first = !d._t;
    d._t = true;
    if (o.sec) d.sec += o.sec;
    if (o.w) { d.w += o.w; Eng.S.stats.wNew += o.w; }
    if (o.r) { d.r += o.r; Eng.S.stats.reviews += o.r; }
    if (o.qn) { d.qn += o.qn; d.qk += o.qk || 0; Eng.S.stats.qn += o.qn; Eng.S.stats.qk += o.qk || 0; }
    if (o.tasks) d.tasks += o.tasks;
    if (o.mock) { d.mocks += o.mock; Eng.S.stats.mocksDone += o.mock; }
    if (o.manual) d.manual = true;
    if (o.act && d.acts.length < 60) d.acts.unshift({ t: o.act, at: Date.now() });

  };
  Eng.manualCheckin = function () {
    var dk = Eng.today();
    if (!Eng.S.days[dk]) Eng.S.days[dk] = { sec: 0, w: 0, r: 0, qn: 0, qk: 0, tasks: 0, mocks: 0, acts: [] };

  /* 学习计时（vocab/grammar/practice 界面活跃时累计） */

  Eng.navHTML = function () {

  Eng.registerView = function (id, render, mount) { Eng.views[id] = render; if (mount) Eng.mounts[id] = mount; };

    var mask = $('#modalMask'), box = $('#modalBox');
    opt = opt || {};
    box.innerHTML = '<div style="display:flex;align-items:flex-start;gap:10px"><div class="grow" style="font-weight:800;font-size:17px">' + (opt.title || '') + '</div>' +
      (opt.noClose ? '' : '<button class="icon-btn" data-close style="width:30px;height:30px;font-size:14px">✕</button></div>') +
      html;
    mask.hidden = false;
    Eng.modalOpen = true;
    Eng.updateModalBtn();
    return box;
  };
  Eng.updateModalBtn = function () { };
  Eng.closeModal = function () {
    $('#modalMask').hidden = true;
    Eng.modalOpen = false;
  };

  /* ---------------- 全局事件 ---------------- */
  function bind() {
    document.addEventListener('click', function (ev) {
      var el = ev.target.closest ? ev.target.closest('[data-go],[data-act],[data-close],[data-nav]') : null;
      if (!el) return;
      if (el.hasAttribute('data-close')) { Eng.closeModal(); return; }
      var nav = el.getAttribute('data-nav');
      if (nav) { Eng.go(nav); return; }
      var go = el.getAttribute('data-go');
      if (go) { Eng.go(go); return; }
      var act = el.getAttribute('data-act');
      if (act) {
        var fn = Eng.actions[act];
        if (fn) { ev.preventDefault(); fn(el, el.dataset); }
      }
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && Eng.modalOpen) Eng.closeModal();
    });
    document.addEventListener('click', function (ev) {
      if (ev.target && ev.target.id === 'modalMask') Eng.closeModal();
    });
    window.addEventListener('beforeunload', function () { Eng.stopTimer(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) Eng.stopTimer();
    });
  }

  /* 顶部按钮：备份（跳转“我的”） */
  function bindChrome() {
    var sync = $('#syncBtn');
    if (sync) sync.addEventListener('click', function () { Eng.go('me'); });
    var menu = $('#menuBtn');
    if (menu) menu.addEventListener('click', function () {
      var sb = $('#sidebar');
      if (sb.style.display === 'flex') { sb.style.display = ''; }
      else {
        sb.style.position = 'fixed'; sb.style.display = 'flex'; sb.style.zIndex = '60';
        sb.style.width = '250px'; sb.style.top = '0'; sb.style.bottom = '0';
      }
    });
    document.addEventListener('click', function (ev) {
      var sb = $('#sidebar');
      if (sb && sb.style.display === 'flex' && !sb.contains(ev.target) && !ev.target.closest('#menuBtn')) {
        sb.style.display = '';
        sb.style.position = ''; sb.style.width = ''; sb.style.top = ''; sb.style.bottom = '';
      }
    });
  }

  /* ---------------- 启动 ---------------- */
  Eng.start = function () {
    Eng.S = load();
    // 确保弹层蒙版默认隐藏（防止空的白色弹层框常驻屏幕）
    var maskEl = document.getElementById('modalMask');
    if (maskEl) maskEl.hidden = true;
    $('#sideNav').innerHTML = Eng.navHTML();
    $('#bottomNav').innerHTML = Eng.bottomHTML();
    bind();
    bindChrome();
    Eng.go('home');
    // 词典/课程标题点击回首页
    var brand = $('.brand'); if (brand) brand.addEventListener('click', function () { Eng.go('home'); });
  };

  g.Eng = Eng;
})(window);
</script>
<script>/* ==== ui-home ==== *//* ============================================================
   首页：问候 + 打卡 + 今日概览 + 快捷入口 + 成长路径
   ============================================================ */
(function (g) {
  'use strict';
  var E = g.Engine, ED = g.ED, Eng = g.Eng;
  var esc = Eng.esc;

  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];

  function greeting() {
    var h = new Date().getHours();
    if (h < 6) return '夜深了';
    if (h < 9) return '早上好';
    if (h < 12) return '上午好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }

  function recentActs() {
    var out = [];
    var days = Eng.S.days;
    var keys = Object.keys(days).sort();
    for (var i = keys.length - 1; i >= 0 && out.length < 9; i--) {
      var acts = days[keys[i]].acts || [];
      for (var j = 0; j < acts.length && out.length < 9; j++) {
        out.push({ k: keys[i], t: acts[j].t, at: acts[j].at });
      }
    }
    return out;
  }

  function actDot(dk) {
    if (dk === Eng.today()) return '';
    var d = new Date(), y = d.getFullYear(), m = d.getMonth(), dd = d.getDate();
    var wk = new Date(y, m, dd).getDay();
    var names = ['日', '一', '二', '三', '四', '五', '六'];
    return '<span class="tiny muted">周' + names[wk] + '</span>';
  }

  Eng.registerView('home', function () {
    var S = Eng.S, dk = Eng.today();
    var today = Eng.todayRec();
    var streak = E.streak(S.days);
    var ws = Eng.wordState();
    var est = E.estimate(S);
    var phIdx = E.phaseOf(est);
    var ph = E.PHASES[phIdx];
    var startP = 50, spanP = 100; // 50 → 150
    var pct = Math.max(0, Math.min(1, (est - startP) / spanP));
    var mins = Math.round(((today && today.sec) || 0) / 60);
    var goalMin = S.set.goalMin || 30, goalW = S.set.goalW || 20, goalQ = S.set.goalQ || 20;
    var nw = (today && today.w) || 0, nq = (today && today.qn) || 0;
    var rv = (today && today.r) || 0;
    var checked = !!today;

    var d = new Date();
    var bounds = [80, 110, 135, 151];
    var nodes = E.PHASES.map(function (p, i) {
      var cls = 'p-dot';
      if (est >= bounds[i]) cls += ' pass';
      else if (i === phIdx) cls += ' on';
      return '<div class="p-node"><div class="p-line" style="display:' + (i === 0 ? 'none' : 'block') + '"></div>' +
        '<div class="' + cls + '">' + (est >= bounds[i] ? '✓' : (i + 1)) + '</div>' +
        '<div class="p-name">' + p.name + '</div><div class="p-goal">' + p.range + '</div></div>';
    }).join('');

    var recents = recentActs();
    var actsHtml = recents.length ? recents.map(function (a) {
      var ago = '';
      if (a.k === dk) ago = '今天';
      else {
        var diff = E.diffDays(dk, a.k);
        ago = diff === 1 ? '昨天' : diff + ' 天前';
      }
      return '<div class="li-item"><span class="li-ico">📌</span><div class="grow"><div class="li-txt">' + esc(a.t) + '</div><div class="li-sub">' + ago + '</div></div></div>';
    }).join('') : '<div class="empty" style="padding:18px"><div class="big">🌱</div>还没有学习动态，完成一个任务开始吧</div>';

    // 当周 7 天迷你热力
    var weekDots = '';
    for (var i = 6; i >= 0; i--) {
      var kd = E.dayKey(-i);
      var has = !!S.days[kd];
      var isT = kd === dk;
      weekDots += '<div class="center" style="flex:1">' + (has ? '🔥' : '·') + '<div class="tiny muted">' + (isT ? '今天' : '周' + WEEK[E.parseKey(kd).getDay()]) + '</div></div>';
    }

    var heroCta = checked
      ? '<button class="checkin-btn done" title="今日已打卡" data-act="ci" style="cursor:default">✓</button>'
      : '<button class="checkin-btn" title="点击打卡" data-act="ci">✔</button>';

    return '' +
      '<div class="hero">' +
        '<div class="checkin-hero">' +
          heroCta +
          '<div class="grow"><h1>' + greeting() + '，' + esc(S.user.name || '同学') + ' 🌟</h1>' +
          '<p>' + d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 周' + WEEK[d.getDay()] + ' · 已坚持 ' + streak + ' 天</p></div>' +
          '<div class="ring sm" style="--p:' + Math.round(pct * 100) + '"><div class="ring-txt"><b style="font-size:19px">' + est + '</b><div class="tiny" style="opacity:.85">目标 150</div></div></div>' +
        '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">' +
          '<div class="stat-card" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:10px 14px;min-width:110px"><div class="k" style="color:rgba(255,255,255,.85)">🔥 连续打卡</div><div class="v" style="font-size:22px">' + streak + '<small> 天</small></div></div>' +
          '<div class="stat-card" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:10px 14px;min-width:110px"><div class="k" style="color:rgba(255,255,255,.85)">📚 已学词汇</div><div class="v" style="font-size:22px">' + ws.known + '<small> / ' + ws.total + '</small></div></div>' +
          '<div class="stat-card" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:10px 14px;min-width:110px"><div class="k" style="color:rgba(255,255,255,.85)">⏱ 今日学习</div><div class="v" style="font-size:22px">' + mins + '<small> 分钟</small></div></div>' +
          '<div class="stat-card" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:10px 14px;min-width:110px"><div class="k" style="color:rgba(255,255,255,.85)">✅ 语法完成</div><div class="v" style="font-size:22px">' + Object.keys(S.lessons).filter(function (k) { return S.lessons[k].done; }).length + '<small> / ' + ED.course.list.length + '</small></div></div>' +
        '</div>' +
        '<div class="row wrap mt16" style="gap:6px">' +
          '<button class="btn" data-act="planGo" style="background:rgba(255,255,255,.95);color:var(--brand);box-shadow:0 6px 16px rgba(0,0,0,.18)">🧭 我的学习计划</button>' +
          '<button class="btn xs" data-go="vocab" data-m="review" style="background:rgba(255,255,255,.2)">📖 立即开始学习</button>' +
          (ws.due > 0 ? '<button class="btn xs" style="background:rgba(255,255,255,.2)" data-act="goReview">⏰ 复习到期 ' + ws.due + ' 词</button>' : '') +
          '<button class="btn xs" data-act="diagStart" style="background:rgba(255,255,255,.2)">🧭 入学水平测评</button>' +
        '</div>' +
      '</div>' +

      '<div class="sect"><h3>今日任务</h3></div>' +
      '<div class="grid g-auto2">' +
        taskCard('🆕', '学新词', nw + ' / ' + goalW + ' 个', nw >= goalW, 'data-act="goNew"') +
        taskCard('📚', '复习单词', rv + ' 次' + (ws.due ? ' · 到期 ' + ws.due : ''), false, 'data-act="goReview"') +
        taskCard('🎯', '专项练习', nq + ' / ' + goalQ + ' 题', nq >= goalQ, 'data-act="goPractice"') +
        taskCard('⏱', '学习时长', mins + ' / ' + goalMin + ' 分钟', mins >= goalMin, 'data-act="goAny"') +
      '</div>' +

      '<div class="sect"><h3>快捷入口</h3></div>' +
      '<div class="grid g-auto">' +
        actCard('🧭', '学习计划', '从 50 到 150 的完整进阶路线', 'plan') +
        actCard('📖', '背单词', ws.due ? '复习 ' + ws.due + ' 个 + 学新词' : '按记忆曲线学新词', 'vocab') +
        actCard('✏️', '语法课', '18 节系统语法 + 随堂测验', 'grammar') +
        actCard('🎯', '专项训练', '八类真题题型任意刷', 'practice') +
        actCard('📝', '全真模考', '河南专升本题型 · 150 分', 'mock') +
      '</div>' +

      '<div class="sect"><h3>成长路径 · 从 50 到 150</h3></div>' +
      '<div class="card pad">' +
        '<div class="phase mt8">' + nodes + '</div>' +
        '<div class="pbar mt20"><i style="width:' + Math.round(pct * 100) + '%"></i></div>' +
        '<div class="row mt8 wrap"><span class="chip brand">当前阶段：' + ph.name + '</span><span class="chip">' + ph.focus + '</span></div>' +
        '<div class="mt12 grid g2">' +
          '<button class="btn ghost sm" data-act="phaseAction" data-p="' + phIdx + '">查看本阶段任务清单</button>' +
          '<button class="btn sm" data-go="mock">做一套模考验证水平 →</button>' +
        '</div>' +
      '</div>' +

      '<div class="sect"><h3>本周打卡</h3></div>' +
      '<div class="card pad"><div style="display:flex;gap:4px">' + weekDots + '</div></div>' +

      '<div class="sect"><h3>最近动态</h3></div>' +
      '<div class="card pad">' + actsHtml + '</div>';
  });

  function taskCard(ico, t, sub, done, action) {
    return '<div class="act-card" ' + action + '>' +
      '<span class="ico ' + (done ? '' : 'g1') + '" style="' + (done ? 'background:var(--ok-soft)' : '') + '">' + (done ? '✅' : ico) + '</span>' +
      '<div class="grow"><b>' + t + '</b><p>' + sub + '</p></div>' +
      '<span class="arrow">›</span></div>';
  }
  function actCard(ico, t, sub, go) {
    return '<div class="act-card" data-go="' + go + '"><span class="ico g2">' + ico + '</span><div class="grow"><b>' + t + '</b><p>' + sub + '</p></div><span class="arrow">›</span></div>';
  }

  function badge(name) {
    if (Eng.badges && !Eng.badges[name]) { Eng.badges = Eng.badges || {}; }
  }

  Eng.actions.goNew = function () { if (Eng.actions['vw-new']) Eng.actions['vw-new'](); else Eng.go('vocab', { mode: 'new' }); };
  Eng.actions.goReview = function () { if (Eng.actions['vw-review']) Eng.actions['vw-review'](); else Eng.go('vocab', { mode: 'review' }); };
  Eng.actions.goPractice = function () { Eng.go('practice'); };
  Eng.actions.goAny = function () { Eng.go('vocab'); };
  Eng.actions.planGo = function () { Eng.go('plan'); };
  Eng.actions.diagStart = function () { Eng.go('practice', { d: 'diag' }); };

  Eng.actions.ci = function (el) {
    var st = Eng.manualCheckin();
    Eng.toast('🔥 打卡成功！连续 ' + st + ' 天', 2000);
    Eng.go('home');
  };
  Eng.actions.phaseAction = function (el, d) {
    var p = E.PHASES[+d.p];
    Eng.modal(
      '<div class="mt12"><div class="row wrap" style="gap:6px"><span class="chip brand">' + p.name + '</span><span class="chip">' + p.range + ' 分</span></div>' +
      '<p class="muted small mt8">' + p.goal + ' · ' + p.focus + '</p>' +
      '<div class="hr"></div><div style="font-weight:800;margin-bottom:6px">阶段任务清单</div>' +
      p.tasks.map(function (t, i) { return '<div class="li-item"><span class="li-ico" style="background:var(--brand-soft)">' + (i + 1) + '</span><div class="li-txt">' + esc(t) + '</div></div>'; }).join('') +
      '<button class="btn block mt16" data-close>知道了，开始行动</button></div>',
      { title: '📋 ' + p.name + ' · 任务清单' }
    );
  };
})(window);
</script>
<script>/* ==== ui-vocab ==== *//* ============================================================
   单词：词书总览 + 学新词(SRS卡片) + 到期复习 + 词汇测验
   ============================================================ */
(function (g) {
  'use strict';
  var E = g.Engine, ED = g.ED, Eng = g.Eng;
  var esc = Eng.esc;

  /* 会话状态 */
  var V = {
    mode: null,      // 'new' | 'review' | 'quiz' | null
    ids: [], pos: 0, showDef: false, req: 0, res: { w: 0, r: 0, g2: 0, g1: 0, g0: 0 },
    quiz: null, qpos: 0, chosen: -1, qres: []
  };

  function curWord() { return ED.vocab.list[V.ids[V.pos]]; }
  function knownOf(lv) {
    var n = 0;
    ED.vocab.list.forEach(function (w, i) {
      if (w.lv === lv && E.wordKnown(Eng.S.vocab[i])) n++;
    });
    return n;
  }
  function dueOf(lv) {
    var n = 0, now = Date.now();
    ED.vocab.list.forEach(function (w, i) {
      if (w.lv === lv) { var v = Eng.S.vocab[i]; if (v && v.b >= 1 && v.due <= now) n++; }
    });
    return n;
  }

  Eng.registerView('vocab', function (params) {
    if (!V.mode) return overview();
    if (V.mode === 'new' || V.mode === 'review') return flashSession();
    return quizSession();
  });

  /* ---------------- 总览 ---------------- */
  function overview() {
    var ws = Eng.wordState();
    var tierCards = ED.vocab.tiers.map(function (t) {
      var total = ED.vocab.list.filter(function (w) { return w.lv === t.id; }).length;
      var kn = knownOf(t.id), due = dueOf(t.id);
      var pct = total ? Math.round(kn / total * 100) : 0;
      return '<div class="card pad" style="border-top:4px solid ' + t.color + '">' +
        '<div class="row"><b>' + t.name + '</b><span class="chip" style="margin-left:auto">' + total + ' 词</span></div>' +
        '<p class="small muted mt8" style="min-height:34px">' + t.desc + '</p>' +
        '<div class="row mt8"><span class="small muted">已掌握</span><div class="pbar grow"><i style="width:' + pct + '%;background:' + t.color + '"></i></div><b class="small">' + kn + '</b></div>' +
        '<div class="row mt12 wrap" style="gap:6px">' +
          '<button class="btn xs soft" data-act="vw-quiz" data-lv="' + t.id + '">测验' + total + '</button>' +
          (due > 0 ? '<button class="btn xs" style="background:' + t.color + '" data-act="vw-review">复习 ' + due + '</button>' : '') +
          '<button class="btn xs ghost" data-act="vw-sel" data-lv="' + t.id + '">只看本层</button>' +
        '</div></div>';
    }).join('');

    return '' +
      '<div class="hero" style="background:linear-gradient(135deg,#0ea5e9,#6366f1)">' +
        '<div class="checkin-hero">' +
          '<span class="flame">📚</span>' +
          '<div class="grow"><h1>单词记忆舱</h1><p>分级词书 · 记忆曲线自动安排复习 · 先学到期词再学新词</p></div>' +
          '<div class="ring sm" style="--p:' + Math.round(ws.known / ws.total * 100) + '"><div class="ring-txt"><b style="font-size:19px">' + ws.known + '</b><div class="tiny" style="opacity:.85">已掌握</div></div></div>' +
        '</div>' +
      '</div>' +

      '<div class="grid g3 mt16">' +
        '<button class="act-card" data-act="vw-review"><span class="ico g3">⏰</span><div class="grow"><b>到期复习</b><p>' + (ws.due ? ws.due + ' 个词今天到期，快清空' : '今天没有到期词，太棒了') + '</p></div><span class="arrow">›</span></button>' +
        '<button class="act-card" data-act="vw-new"><span class="ico g1">🆕</span><div class="grow"><b>学新词</b><p>按每日目标学习新词，进入记忆曲线</p></div><span class="arrow">›</span></button>' +
        '<button class="act-card" data-act="vw-quiz" data-lv="0"><span class="ico g2">🎯</span><div class="grow"><b>随机测验</b><p>混合抽测，检验真实掌握度</p></div><span class="arrow">›</span></button>' +
      '</div>' +

      '<div class="sect"><h3>分级词书</h3><span class="muted small">累计已学 ' + ws.seen + ' / ' + ws.total + '</span></div>' +
      '<div class="grid g3">' + tierCards + '</div>' +

      '<div class="sect"><h3>记忆原理</h3></div>' +
      '<div class="card pad small muted">' +
        '新词按 1-2-4-7-15-30-45 天间隔进入复习队列；' +
        '标记“认识”向后推进复习间隔，“模糊”明天再见，“忘记”回到起点重学。' +
        '先复习到期词、再学新词，遗忘率最低。单词本库 ' + ws.total + ' 词：覆盖专升本公共英语高频词汇，后续可导入扩充（我的 → 数据）。' +
      '</div>';
  }

  /* ---------------- 卡片会话 ---------------- */
  function flashSession() {
    if (V.pos >= V.ids.length) return flashDone();
    var w = curWord();
    var idx = V.ids[V.pos];
    var rec = Eng.S.vocab[idx];
    var isReview = V.mode === 'review';
    var box = rec ? rec.b : 0;
    var total = V.ids.length;

    var bar = V.pos / total * 100;

    return '' +
      '<div style="max-width:640px;margin:0 auto">' +
      '<div class="progress-line mb16"><button class="btn plain xs" data-act="vw-exit">← 退出</button>' +
        '<div class="pbar grow"><i style="width:' + bar + '%"></i></div>' +
        '<span class="qlabel">' + (V.pos + 1) + ' / ' + total + '</span></div>' +
      (isReview ? '<div class="row mb12 wrap" style="gap:6px"><span class="sec-tag">到期复习</span><span class="chip warn">📦 记忆盒 ' + box + '</span></div>' :
        '<div class="row mb12 wrap" style="gap:6px"><span class="sec-tag">学新词</span></div>') +
      '<div class="word-card">' +
        '<div class="w-meta">' + esc(w.p) + (isReview ? ' · 盒子 ' + box : ' · 新词') + '</div>' +
        '<div class="w-en">' + esc(w.w) + '</div>' +
        (V.showDef
          ? '<div class="w-def">' + esc(w.m) + '</div>' +
            '<div class="muted small mt8">“' + esc(w.m) + '”</div>'
          : '<button class="btn ghost sm mt12" data-act="vw-flip">👀 显示释义</button>') +
      '</div>' +
      (V.showDef ? '' : '<div class="muted center small mt8">先回忆，再看答案，记忆更深</div>') +
      '<div class="flash-actions mt20">' +
        (V.showDef
          ? '<button class="btn bad" data-act="vw-grade" data-g="0">😵 忘了</button>' +
            '<button class="btn warn" data-act="vw-grade" data-g="1">🤔 模糊</button>' +
            '<button class="btn ok" data-act="vw-grade" data-g="2">😄 认识</button>'
          : '') +
      '</div>' +
      '<div class="center tiny muted mt16">每日目标新词 ' + (Eng.S.set.goalW || 20) + ' 个 · 全部学完自动打卡</div>' +
      '</div>';
  }
  function flashDone() {
    var r = V.res;
    var t = V.mode === 'review' ? '复习完成' : '新词学习完成';
    var known = r.g2;
    return '<div style="max-width:560px;margin:30px auto" class="center">' +
      '<div class="card pad" style="padding:34px">' +
        '<div style="font-size:52px">' + (r.g0 === 0 ? '🎉' : '🌱') + '</div>' +
        '<h2 class="mt8">' + t + '！</h2>' +
        '<p class="muted">本轮 ' + V.ids.length + ' 个 · 认识 ' + r.g2 + ' · 模糊 ' + r.g1 + ' · 忘记 ' + r.g0 + '</p>' +
        '<div class="grid g3 mt20">' +
          '<div class="stat-card"><div class="k">😄 认识</div><div class="v">' + r.g2 + '</div></div>' +
          '<div class="stat-card"><div class="k">🤔 模糊</div><div class="v">' + r.g1 + '</div></div>' +
          '<div class="stat-card"><div class="k">😵 忘记</div><div class="v">' + r.g0 + '</div></div>' +
        '</div>' +
        '<div class="row mt20 center" style="justify-content:center;gap:10px;flex-wrap:wrap">' +
          '<button class="btn soft" data-act="vw-new">再学一组新词</button>' +
          '<button class="btn ghost" data-act="vw-review">复习到期词</button>' +
          '<button class="btn" data-go="home">返回首页</button>' +
        '</div>' +
      '</div></div>';
  }

  /* ---------------- 测验 ---------------- */
  function quizSession() {
    if (!V.quiz) return overview();
    var st = V.quiz;
    if (st.items.length === 0) return '<div class="empty"><div class="big">📭</div>本层还没有已学单词，先背一些再来测验</div>';
    if (V.qpos >= st.items.length) return quizDone();
    var it = st.items[V.qpos];
    var w = ED.vocab.list[it.id];

    var opts = it.os.map(function (o, i) {
      var cls = 'qz-option';
      var letter = 'ABCD'[i];
      if (V.chosen >= 0) {
        if (i === it.ai) cls += ' right';
        else if (i === V.chosen) cls += ' wrong';
        cls += ' disabled';
      }
      return '<button class="' + cls + '" data-act="vw-ans" data-i="' + i + '" ' + (V.chosen >= 0 ? 'disabled' : '') + '>' +
        '<span class="letter let-' + letter + '">' + letter + '</span><span>' + esc(o) + '</span></button>';
    }).join('');

    return '' +
      '<div style="max-width:620px;margin:0 auto">' +
      '<div class="progress-line mb16"><button class="btn plain xs" data-act="vw-exit">← 退出</button>' +
        '<div class="pbar grow"><i style="width:' + (V.qpos / st.items.length * 100) + '%"></i></div>' +
        '<span class="qlabel">' + (V.qpos + 1) + ' / ' + st.items.length + '</span></div>' +
      '<div class="card pad"><div class="row wrap mb16" style="gap:8px"><span class="sec-tag">词义测验</span><span class="chip">已答对 ' + V.qres.filter(function (x) { return x; }).length + '</span></div>' +
        '<div class="qz-stem center" style="font-size:30px;letter-spacing:.5px">' + esc(w.w) + '</div>' +
        '<div class="center muted small mb16">' + esc(w.p) + ' · 选出正确释义</div>' +
        '<div class="grid" style="gap:10px">' + opts + '</div>' +
        (V.chosen >= 0 ? '<div class="qz-exp mt12">' + esc(w.m) + (V.chosen === it.ai ? ' ✓ 回答正确' : ' — 你选错了，正确答案已标绿') + '</div>' +
          '<button class="btn block mt16" data-act="vw-next">' + (V.qpos + 1 >= st.items.length ? '查看结果' : '下一题 →') + '</button>' : '') +
      '</div></div>';
  }
  function quizDone() {
    var ok = V.qres.filter(function (x) { return x; }).length;
    var total = V.qres.length;
    var pct = total ? Math.round(ok / total * 100) : 0;
    var list = V.quiz.items.map(function (it, i) {
      var w = ED.vocab.list[it.id];
      return '<div class="li-item"><span class="li-ico" style="' + (V.qres[i] ? 'background:var(--ok-soft)' : 'background:var(--bad-soft)') + '">' + (V.qres[i] ? '✓' : '✗') + '</span>' +
        '<div><div class="li-txt">' + esc(w.w) + ' <span class="chip">' + esc(w.p) + '</span></div><div class="li-sub">' + esc(w.m) + '</div></div></div>';
    }).join('');
    return '<div style="max-width:640px;margin:0 auto" class="center">' +
      '<div class="card pad" style="padding:30px">' +
        '<div style="font-size:50px">' + (pct >= 80 ? '🏆' : pct >= 60 ? '💪' : '📖') + '</div>' +
        '<h2>' + ok + ' / ' + total + ' 正确</h2>' +
        '<div class="pbar mt12"><i style="width:' + pct + '%;background:' + (pct >= 80 ? 'var(--ok)' : pct >= 60 ? 'var(--warn)' : 'var(--bad)') + '"></i></div>' +
        (pct < 60 ? '<p class="muted mt12 small">正确率偏低，建议把本层词重学一轮再来测验</p>' : pct < 80 ? '<p class="muted mt12 small">不错！再把错词复习一下就能更好</p>' : '<p class="muted mt12 small">掌握扎实，继续保持！</p>') +
      '</div>' +
      '<div class="card pad mt16" style="text-align:left">' + (list || '<div class="empty">本轮无错题</div>') + '</div>' +
      '<div class="row mt16 center" style="justify-content:center;gap:10px"><button class="btn soft" data-act="vw-quiz" data-lv="0">再测一组</button><button class="btn ghost" data-act="vw-review">复习单词</button><button class="btn" data-go="home">返回首页</button></div>' +
    '</div>';
  }

  /* ---------------- 动作 ---------------- */
  function resetSession() {
    V.pos = 0; V.showDef = false; V.req = 0;
    V.res = { w: 0, r: 0, g2: 0, g1: 0, g0: 0 };
    V.quiz = null; V.qpos = 0; V.chosen = -1; V.qres = [];
  }

  Eng.actions['vw-exit'] = function () { V.mode = null; resetSession(); Eng.go('vocab'); };

  Eng.actions['vw-new'] = function () {
    var n = Math.max(5, Eng.S.set.goalW || 20);
    var ids = Eng.newWords(n);
    if (!ids.length) { Eng.toast('词库已全部学过，进入复习模式吧'); V.mode = null; resetSession(); Eng.go('vocab'); return; }
    resetSession(); V.mode = 'new'; V.ids = ids;
    Eng.go('vocab', { mode: 'new' });
  };
  Eng.actions['vw-review'] = function () {
    var ids = E.shuffle(Eng.dueWords());
    if (!ids.length) { Eng.toast('🎉 今日到期词已清零'); Eng.go('vocab'); return; }
    resetSession(); V.mode = 'review'; V.ids = ids;
    Eng.go('vocab', { mode: 'review' });
  };
  Eng.actions['vw-sel'] = function (el, d) {
    Eng.toast('本层专属入口：在“我的-词书设置”中管理'); Eng.go('vocab');
  };
  Eng.actions['vw-flip'] = function () { V.showDef = true; Eng.go('vocab', { mode: V.mode }); };

  Eng.actions['vw-grade'] = function (el, d) {
    var gl = +d.g;
    var id = V.ids[V.pos];
    var st = Eng.S.vocab[id] || {};
    st = E.srsApply(st, gl);
    Eng.S.vocab[id] = st;
    if (gl === 2) V.res.g2++; else if (gl === 1) V.res.g1++; else { V.res.g0++; if (V.req < 4) { V.ids.push(id); V.req++; } }
    // 记录(首见计入当日新词，复习计入复习次数)
    var ever = (st.ok + st.ng) > 0;
    var rec = { w: 0, r: 0 };
    if (V.mode === 'new' && !ever) { rec.w = 1; V.res.w++; } else { rec.r = 1; V.res.r++; }
    V.pos++;
    if (V.pos >= V.ids.length) {
      var res = Eng.record({ w: rec.w, r: rec.r, act: (V.mode === 'review' ? '📖 完成到期词复习 ' : '📖 学习新词 ') + V.ids.length + ' 个' });
      if (res.first) Eng.toast('🔥 今日打卡成功！连续 ' + res.streak + ' 天', 2400);
      Eng.save();
      Eng.go('vocab', { mode: V.mode });
    } else {
      Eng.record({ w: rec.w, r: rec.r });
      V.showDef = false;
      Eng.save();
      Eng.go('vocab', { mode: V.mode });
    }
  };

  Eng.actions['vw-quiz'] = function (el, d) {
    var lv = +d.lv;
    var pool = [];
    ED.vocab.list.forEach(function (w, i) {
      if ((lv === 0 || w.lv === lv) && Eng.S.vocab[i] && E.wordKnown(Eng.S.vocab[i])) pool.push(i);
    });
    if (pool.length < 4) { Eng.toast('可测单词不足（' + pool.length + ' 个），先多学一些'); Eng.go('vocab'); return; }
    var picked = E.pick(pool, Math.min(20, pool.length));
    var items = picked.map(function (id) {
      var w = ED.vocab.list[id];
      var wrong = E.pick(ED.vocab.list.filter(function (x) { return x.lv === w.lv && x !== w && x.m !== w.m; }), 3).map(function (x) { return x.m; });
      var o = [w.m].concat(wrong);
      var sc = E.shufChoices(o, 0);
      return { id: id, os: sc.os, ai: sc.ai };
    });
    resetSession(); V.mode = 'quiz'; V.quiz = { items: items };
    Eng.go('vocab', { mode: 'quiz' });
  };
  Eng.actions['vw-ans'] = function (el, d) {
    if (V.chosen >= 0) return;
    var i = +d.i;
    V.chosen = i;
    V.qres.push(i === V.quiz.items[V.qpos].ai);
    Eng.go('vocab', { mode: 'quiz' });
  };
  Eng.actions['vw-next'] = function () {
    if (V.chosen < 0) return;
    if (V.qpos + 1 >= V.quiz.items.length) {
      var ok = V.qres.filter(function (x) { return x; }).length;
      var res = Eng.record({ qn: V.qres.length, qk: ok, act: '🎯 词义测验 ' + ok + '/' + V.qres.length + ' 正确' });
      if (res.first) Eng.toast('🔥 今日打卡成功！连续 ' + res.streak + ' 天', 2400);
      V.qpos++;
      Eng.save();
      Eng.go('vocab', { mode: 'quiz' });
    } else {
      V.qpos++; V.chosen = -1;
      Eng.go('vocab', { mode: 'quiz' });
    }
  };
})(window);
</script>
<script>/* ==== ui-grammar ==== *//* ============================================================
   语法：分层系统课 + 精讲 + 随堂测验 + 结课打卡
   ============================================================ */
(function (g) {
  'use strict';
  var E = g.Engine, ED = g.ED, Eng = g.Eng;
  var esc = Eng.esc;

  var G = { view: 'list', id: null, q: null, qpos: 0, chosen: -1, qres: [] };
  var LVCOL = { 1: '#0ea5e9', 2: '#0ea56a', 3: '#7c3aed' };
  var LVNAME = { 1: 'A 级', 2: 'B 级', 3: 'C 级' };

  function lessonById(id) {
    for (var i = 0; i < ED.course.list.length; i++) if (ED.course.list[i].id === id) return ED.course.list[i];
    return null;
  }

  Eng.registerView('grammar', function () {
    if (G.view === 'detail' && G.id) return detail(lessonById(G.id));
    if (G.view === 'quiz') return quiz();
    return listView();
  });

  /* ---------- 列表 ---------- */
  function listView() {
    var html = ED.course.levels.map(function (lv) {
      var items = ED.course.list.filter(function (l) { return l.lv === lv.lv; });
      var done = items.filter(function (l) { var s = Eng.S.lessons[l.id]; return s && s.done; }).length;
      return '<div class="card pad">' +
        '<div class="row wrap"><span style="width:12px;height:12px;border-radius:4px;background:' + lv.color + '"></span>' +
        '<b>' + lv.name + '</b><span class="chip" style="margin-left:auto">' + done + ' / ' + items.length + '</span></div>' +
        '<p class="small muted mt8">' + lv.desc + '</p>' +
        '<div class="mt12" style="display:flex;flex-direction:column;gap:6px">' +
        items.map(function (l) {
          var s = Eng.S.lessons[l.id];
          return '<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:#f8f9fd;border:1px solid var(--line)">' +
            '<span class="chip" style="background:' + lv.color + '22;color:' + lv.color + ';flex:0 0 auto">' + l.id + '</span>' +
            '<div class="grow"><b style="font-size:13.5px">' + esc(l.title) + '</b><div class="tiny muted">约 ' + l.est + ' · 随堂测验 ' + l.qs.length + ' 题</div></div>' +
            (s && s.done ? '<span class="chip ok">✅ 已学 · ' + Math.round(s.best * 100) + '%</span>' : '<span class="chip warn">未学</span>') +
            '<button class="btn xs soft" data-act="gr-open" data-id="' + l.id + '">' + (s && s.done ? '复习' : '开始') + '</button>' +
          '</div>';
        }).join('') + '</div></div>';
    }).join('');

    return '' +
      '<div class="hero" style="background:linear-gradient(135deg,#7c3aed,#4f46e5)">' +
        '<div class="checkin-hero">' +
          '<span class="flame">✏️</span>' +
          '<div class="grow"><h1>语法系统课</h1><p>A 基础重建 → B 高中核心 → C 专升本拔高，一课一测，通关结课</p></div>' +
          '<div class="ring sm" style="--p:' + donePct() + '"><div class="ring-txt"><b style="font-size:19px">' + doneCount() + '</b><div class="tiny" style="opacity:.85">/' + ED.course.list.length + ' 课</div></div></div>' +
        '</div>' +
      '</div>' +
      '<div class="grid g1 mt16" style="gap:16px">' + html + '</div>' +
      '<div class="sect"><h3>学习建议</h3></div>' +
      '<div class="card pad small muted">先按估分进入对应层级：' +
        '<b>50-80</b> 分主攻 A 级；<b>80-110</b> 分主攻 B 级；<b>110+</b> 分主攻 C 级。<br>' +
        '每课流程：读精讲 → 看例句 → 记易错点 → 完成随堂测验（≥60% 结课）。语法不会单独考选择，但它是完形、改错、翻译与写作的地基。' +
      '</div>';
  }
  function doneCount() { return ED.course.list.filter(function (l) { var s = Eng.S.lessons[l.id]; return s && s.done; }).length; }
  function donePct() { return Math.round(doneCount() / ED.course.list.length * 100); }

  /* ---------- 详情 ---------- */
  function detail(L) {
    if (!L) { G.view = 'list'; return listView(); }
    var s = Eng.S.lessons[L.id];
    var lv = ED.course.levels.filter(function (x) { return x.lv === L.lv; })[0];
    var blocks = L.blocks.map(function (b) {
      if (b.k === 'p') return '<p>' + esc(b.x) + '</p>';
      if (b.k === 'eg') return '<div class="eg">' + esc(b.en) + '<span class="zh">' + esc(b.zh) + '</span></div>';
      if (b.k === 'tip') return '<div class="gram-box" style="border-left-color:var(--warn)"><b style="color:var(--warn)">⚡ 易错提醒：</b>' + esc(b.x) + '</div>';
      return '';
    }).join('');

    return '' +
      '<button class="btn plain xs mb16" data-act="gr-back">← 返回课程列表</button>' +
      '<div class="card pad lesson-block">' +
        '<div class="row wrap"><span class="chip" style="background:' + LVCOL[L.lv] + '22;color:' + LVCOL[L.lv] + '">' + LVNAME[L.lv] + ' · ' + lv.name + '</span>' +
        '<span class="chip">' + L.est + '</span>' +
        (s && s.done ? '<span class="chip ok" style="margin-left:auto">✅ 已结课 · 最佳 ' + Math.round(s.best * 100) + '%</span>' : '<span class="chip warn" style="margin-left:auto">未结课</span>') +
        '</div>' +
        '<h2 class="mt12" style="font-size:23px">' + esc(L.title) + '</h2>' +
        '<div class="gram-box mt16" style="line-height:1.9">' + blocks + '</div>' +
        '<div class="hr"></div>' +
        '<div class="row wrap"><b>随堂测验 · ' + L.qs.length + ' 题</b>' +
        '<span class="muted small">≥60% 正确即结课</span>' +
        '<button class="btn sm" style="margin-left:auto" data-act="gr-start" data-id="' + L.id + '">' + (s && s.done ? '重新测验' : '开始测验 →') + '</button></div>' +
      '</div>';
  }

  /* ---------- 测验 ---------- */
  function quiz() {
    var st = G.q;
    if (!st) return listView();
    if (G.qpos >= st.items.length) return quizDone(st);
    var it = st.items[G.qpos];
    var opts = it.o.map(function (o, i) {
      var cls = 'qz-option', letter = 'ABCD'[i];
      if (G.chosen >= 0) {
        if (i === it.ai) cls += ' right'; else if (i === G.chosen) cls += ' wrong';
        cls += ' disabled';
      }
      return '<button class="' + cls + '" data-act="gr-ans" data-i="' + i + '" ' + (G.chosen >= 0 ? 'disabled' : '') + '>' +
        '<span class="letter let-' + letter + '">' + letter + '</span><span>' + esc(o) + '</span></button>';
    }).join('');
    return '' +
      '<button class="btn plain xs mb16" data-act="gr-exit">← 退出测验</button>' +
      '<div class="mock-quiz">' +
      '<div class="progress-line mb16"><div class="pbar grow"><i style="width:' + (G.qpos / st.items.length * 100) + '%"></i></div>' +
        '<span class="qlabel">' + (G.qpos + 1) + ' / ' + st.items.length + '</span></div>' +
      '<div class="card pad">' +
        '<span class="sec-tag">' + esc(st.lesson.id + ' · ' + st.lesson.title) + '</span>' +
        '<div class="qz-stem mt12">' + (G.qpos + 1) + '. ' + esc(it.q) + '</div>' +
        '<div class="grid mt16" style="gap:10px">' + opts + '</div>' +
        (G.chosen >= 0 ? '<div class="qz-exp mt12">' + esc(it.e) + '</div>' +
          '<button class="btn block mt16" data-act="gr-next">' + (G.qpos + 1 >= st.items.length ? '查看结课结果' : '下一题 →') + '</button>' : '') +
      '</div></div>';
  }
  function quizDone(st) {
    var ok = G.qres.filter(function (x) { return x; }).length, total = G.qres.length;
    var pct = total ? ok / total : 0;
    var pass = pct >= 0.6;
    // 保存结课
    var prev = Eng.S.lessons[st.lesson.id];
    var best = prev && prev.best ? prev.best : 0;
    var isNew = !(prev && prev.done);
    if (pass) {
      Eng.S.lessons[st.lesson.id] = { done: true, best: Math.max(best, pct), at: Date.now() };
    } else if (prev && prev.done) {
      Eng.S.lessons[st.lesson.id] = { done: true, best: Math.max(best, pct), at: prev.at };
    }
    Eng.save();
    var wrongs = st.items.map(function (it, i) {
      var okq = G.qres[i];
      if (okq) return null;
      return '<div class="li-item"><span class="li-ico" style="background:var(--bad-soft)">✗</span>' +
        '<div><div class="li-txt">' + esc(it.q) + '</div><div class="li-sub">正确答案：' + esc(it.o[it.ai]) + ' — ' + esc(it.e) + '</div></div></div>';
    }).filter(Boolean).join('');
    return '<div style="max-width:660px;margin:0 auto" class="center">' +
      '<div class="card pad" style="padding:30px">' +
        '<div style="font-size:50px">' + (pass ? (pct >= 0.85 ? '🏆' : '🎉') : '💪') + '</div>' +
        '<h2 class="mt8">' + (pass ? '测验通过，课程已结课！' : '还差一点，再复习一次吧') + '</h2>' +
        '<p class="muted">' + esc(st.lesson.title) + ' · 正确 ' + ok + ' / ' + total + '（' + Math.round(pct * 100) + '%' + (pass ? ' ≥ 60%' : '') + '）</p>' +
        '<div class="pbar mt12"><i style="width:' + Math.round(pct * 100) + '%;background:' + (pass ? 'var(--ok)' : 'var(--warn)') + '"></i></div>' +
      '</div>' +
      (wrongs ? '<div class="card pad mt16" style="text-align:left"><div style="font-weight:800" class="mb8">错题回顾</div>' + wrongs + '</div>' : '') +
      '<div class="row mt16 center" style="justify-content:center;gap:10px">' +
        '<button class="btn soft" data-act="gr-start" data-id="' + st.lesson.id + '">再做一遍</button>' +
        '<button class="btn ghost" data-act="gr-back">返回课程</button>' +
        '<button class="btn" data-go="grammar">看下一课</button>' +
      '</div></div>';
  }

  /* ---------- actions ---------- */
  Eng.actions['gr-open'] = function (el, d) { G.view = 'detail'; G.id = d.id; G.q = null; Eng.go('grammar'); };
  Eng.actions['gr-back'] = function () { G.view = 'list'; G.id = null; G.q = null; Eng.go('grammar'); };
  Eng.actions['gr-exit'] = function () { G.view = 'list'; G.id = null; G.q = null; Eng.go('grammar'); };

  Eng.actions['gr-start'] = function (el, d) {
    var L = lessonById(d.id);
    if (!L) return;
    var items = L.qs.map(function (q) {
      var sc = E.shufChoices(q.o, q.a);
      return { q: q.q, o: sc.os, ai: sc.ai, e: q.e, a: q.a };
    });
    G.view = 'quiz'; G.q = { lesson: L, items: items }; G.qpos = 0; G.chosen = -1; G.qres = [];
    Eng.go('grammar');
  };
  Eng.actions['gr-ans'] = function (el, d) {
    if (!G.q || G.qpos >= G.q.items.length || G.chosen >= 0) return;
    G.chosen = +d.i;
    G.qres.push(G.chosen === G.q.items[G.qpos].ai);
    Eng.record({ qn: 1, qk: G.qres[G.qres.length - 1] ? 1 : 0 });
    Eng.go('grammar');
  };
  Eng.actions['gr-next'] = function () {
    if (G.chosen < 0 || !G.q) return;
    var done = G.qpos + 1 >= G.q.items.length;
    G.qpos++; G.chosen = -1;
    if (done) {
      var ok = G.qres.filter(function (x) { return x; }).length;
      Eng.record({ act: '✏️ 随堂测验：' + G.q.lesson.id + ' ' + ok + '/' + G.qres.length + ' 正确' });
      Eng.save();
    }
    Eng.go('grammar');
  };
})(window);
</script>
<script>/* ==== ui-practice ==== *//* ============================================================
   专项训练：八类真题题型 + 入学水平测评
   河南专升本题型：阅读/完形/判断/英译汉/选词/汉译英/改错/写作
   ============================================================ */
(function (g) {
  'use strict';
  var E = g.Engine, ED = g.ED, Eng = g.Eng;
  var esc = Eng.esc;

  var P = { mode: null, items: [], pos: 0, chosen: null, res: [], meta: null };

  var MODES = [
    { id: 'syn', ico: '🧩', name: '语法闯关', desc: '随堂测验题库随机抽 10 题，按 A/B/C 分级', col: '#4f46e5', need: 'all' },
    { id: 'read', ico: '📖', name: '阅读理解', desc: '真题结构：每篇 5 题 × 2 分，先读后答', col: '#0ea5e9', need: 'reading' },
    { id: 'cloze', ico: '🔗', name: '完形填空', desc: '语境 + 词法语法综合，一空一分', col: '#0ea56a', need: 'cloze' },
    { id: 'tf', ico: '⚖️', name: '判断正误', desc: '短文判断 True / False，每题 2 分', col: '#f59e0b', need: 'tf' },
    { id: 'ec', ico: '🌐', name: '英译汉选择', desc: '四选一选出最佳译文，每题 2 分', col: '#e5484d', need: 'ec' },
    { id: 'wf', ico: '🧺', name: '选词填空', desc: '10 词选 5 填入短文，每空 3 分', col: '#d946ef', need: 'wf' },
    { id: 'ce', ico: '✍️', name: '汉译英', desc: '单句翻译，参考译文自评，每句 3 分', col: '#14b8a6', need: 'ce' },
    { id: 'ef', ico: '🔧', name: '改错', desc: '找出句中错误并改正，每题 2 分', col: '#8b5cf6', need: 'ef' },
    { id: 'write', ico: '📄', name: '写作范文库', desc: '提纲作文 + 高分范文学习', col: '#64748b', need: 'essays' }
  ];
  var MODE_MAP = {}; MODES.forEach(function (m) { MODE_MAP[m.id] = m; });

  function mstat(id) {
    var s = Eng.S.mstats || {};
    return s[id] || { n: 0, ok: 0 };
  }
  function pmRec(id, ok) {
    Eng.S.mstats = Eng.S.mstats || {};
    var s = Eng.S.mstats[id] || (Eng.S.mstats[id] = { n: 0, ok: 0 });
    s.n++; if (ok) s.ok++;
    Eng.save();
  }

  Eng.registerView('practice', function (params) {
    if (params && params.d === 'diag') { if (!D.active) startDiag(); return diagScreen(); }
    if (P.mode === 'write') return writeView();
    if (P.mode && P.items.length) return session();
    return landing();
  });

  /* ---------------- 入口 ---------------- */
  function landing() {
    var diag = Eng.S.diag;
    var cards = MODES.map(function (m) {
      var st = mstat(m.id);
      var acc = st.n ? Math.round(st.ok / st.n * 100) : null;
      return '<div class="act-card" data-act="pr-start" data-m="' + m.id + '">' +
