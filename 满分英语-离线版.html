        '<span class="ico" style="background:' + m.col + '22">' + m.ico + '</span>' +
        '<div class="grow"><b>' + m.name + '</b><p>' + m.desc + '</p></div>' +
        '<div class="center" style="min-width:54px"><b class="small" style="color:' + m.col + '">' + (acc != null ? acc + '%' : '—') + '</b><div class="tiny muted">' + st.n + ' 题</div></div>' +
        '<span class="arrow">›</span></div>';
    }).join('');
    return '' +
      '<div class="hero" style="background:linear-gradient(135deg,#0f172a,#334155)">' +
        '<div class="checkin-hero">' +
          '<span class="flame">🎯</span>' +
          '<div class="grow"><h1>真题专项训练</h1><p>按河南专升本公共英语题型逐项突破，每题即时批改 + 解析</p></div>' +
          (diag ? '<div style="text-align:center"><div class="ring sm" style="--p:' + Math.min(100, Math.round(diag.score / 150 * 100)) + '"><div class="ring-txt"><b style="font-size:17px">' + diag.score + '</b><div class="tiny" style="opacity:.85">基线分</div></div></div><button class="btn xs mt8" data-act="diagStart" style="background:rgba(255,255,255,.18)">重新测评</button></div>'
            : '<div style="text-align:center"><button class="btn warn sm" data-act="diagStart">🧭 入学测评</button><p class="tiny mt8" style="opacity:.85">测出你的起始分</p></div>') +
        '</div>' +
      '</div>' +
      '<div class="grid g2 mt16" style="gap:12px">' + cards + '</div>' +
      '<div class="sect"><h3>题型与分值（河南专升本公共英语 · 满分 150）</h3></div>' +
      '<div class="card pad small">' +
        '<table class="tbl"><tr><th>部分</th><th>题量</th><th>分值</th></tr>' +
        '<tr><td>Ⅰ 阅读理解</td><td>4 篇 / 20 题</td><td>2 分×20 = 40</td></tr>' +
        '<tr><td>Ⅱ 完形填空</td><td>1 篇 / 20 空</td><td>1 分×20 = 20</td></tr>' +
        '<tr><td>Ⅲ 判断正误</td><td>5 题</td><td>2 分×5 = 10</td></tr>' +
        '<tr><td>Ⅳ 英译汉选择</td><td>5 题</td><td>2 分×5 = 10</td></tr>' +
        '<tr><td>Ⅴ 选词填空</td><td>5 空</td><td>3 分×5 = 15</td></tr>' +
        '<tr><td>Ⅵ 汉译英翻译</td><td>5 句</td><td>3 分×5 = 15</td></tr>' +
        '<tr><td>Ⅶ 改错</td><td>10 题</td><td>2 分×10 = 20</td></tr>' +
        '<tr><td>Ⅷ 写作</td><td>1 篇</td><td>20 分</td></tr>' +
        '</table><p class="muted tiny mt8">题型结构以近年河南专升本公共英语真题为参考（考试时间约 150 分钟）。</p>' +
      '</div>';
  }

  /* ---------------- 模式选择与组题 ---------------- */
  Eng.actions['pr-start'] = function (el, d) {
    var m = MODE_MAP[d.m];
    if (m.id === 'write') { P.mode = 'write'; P.items = []; Eng.go('practice'); return; }
    if (m.need === 'reading') {
      var ps = E.pick(ED.bank.reading, 1)[0];
      P.meta = { passage: ps };
      P.items = ps.qs.map(function (q, i) {
        var sc = E.shufChoices(q.o, q.a);
        return { ty: 'mcq', q: q.q, o: sc.os, ai: sc.ai, e: q.e, src: i + 1 };
      });
    } else if (m.need === 'cloze') {
      var cl = E.pick(ED.bank.cloze, 1)[0];
      var idx = E.shuffle(cl.opts.map(function (_, i) { return i; })).slice(0, 20).sort(function (a, b) { return a - b; });
      P.meta = { cloze: cl };
      P.items = idx.map(function (i) {
        var sc = E.shufChoices(cl.opts[i], cl.ans[i]);
        return { ty: 'cloze', blankNo: i + 1, o: sc.os, ai: sc.ai, e: clozeExp(cl, i) };
      });
    } else if (m.need === 'tf') {
      var tf = E.pick(ED.bank2.tf, 1)[0];
      P.meta = { tf: tf };
      P.items = tf.items.map(function (it) {
        return { ty: 'mcq', q: it.s, o: ['正确（True）', '错误（False）'], ai: it.v ? 0 : 1, e: it.v ? '表述与短文内容相符 → True' : '表述与短文内容不符 → False（对照原文细节）', src: '短文' };
      });
    } else if (m.need === 'ec') {
      P.items = E.pick(ED.bank2.ec, 6).map(function (q) {
        var sc = E.shufChoices(q.o, q.a);
        return { ty: 'mcq', q: q.en, o: sc.os, ai: sc.ai, e: q.e };
      });
    } else if (m.need === 'wf') {
      var wf = E.pick(ED.bank2.wf, 1)[0];
      P.meta = { wf: wf };
      P.items = [1, 2, 3, 4, 5].map(function (n) {
        return { ty: 'wf', n: n, ans: wf.key[n - 1], exp: wf.exp };
      });
    } else if (m.need === 'ce') {
      P.items = E.pick(ED.bank2.ce, 6).map(function (q, i) {
        return { ty: 'ce', zh: q.zh, ref: q.ref, note: q.note };
      });
    } else if (m.need === 'ef') {
      P.items = E.pick(ED.bank2.ef, 6).map(function (q) {
        return { ty: 'ef', s: q.s, bad: q.bad, good: q.good, e: q.e };
      });
    } else { // syn 语法闯关
      var pool = ED.course.quiz.slice();
      P.items = E.pick(pool, Math.min(10, pool.length)).map(function (q) {
        var sc = E.shufChoices(q.o, q.a);
        return { ty: 'mcq', q: q.q, o: sc.os, ai: sc.ai, e: q.e + '（来自课程 ' + q.lesson + '）' };
      });
    }
    P.mode = m.id; P.pos = 0; P.chosen = null; P.res = [];
    Eng.go('practice');
  };
  function clozeExp(cl, i) {
    var blanks = ['时态与主谓一致', '可数与不可数', '连接词逻辑', '固定搭配', '代词指代', '非谓语', '介词', '情态动词', '冠词', '宾语从句', '短语动词', '让步/条件连词', '名词单复数', '结果状语从句', '介词', '固定搭配', '介词', '短语动词', '冠词', '序数词'];
    return '第 ' + (i + 1) + ' 空 · 考查' + (blanks[i] || '语境词义') + '（结合前后文判断）';
  }

  /* ---------------- 会话渲染 ---------------- */
  function session() {
    var m = MODE_MAP[P.mode];
    if (P.pos >= P.items.length) return result();
    var it = P.items[P.pos];
    var answered = P.chosen !== null;

    var ctx = '';
    if (P.mode === 'read') ctx = '<div class="reading-pane mb16"><div class="row mb8 wrap" style="gap:6px"><span class="sec-tag">📖 阅读理解</span><span class="chip">' + esc(P.meta.passage.t) + '</span></div><div class="article">' + P.meta.passage.tx.split('\n').map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div></div>';
    if (P.mode === 'tf') ctx = '<div class="reading-pane mb16"><div class="row mb8 wrap" style="gap:6px"><span class="sec-tag">⚖️ 判断正误</span><span class="chip">' + esc(P.meta.tf.t) + '</span></div><div class="article"><p>' + esc(P.meta.tf.tx) + '</p></div></div>';
    if (P.mode === 'cloze') ctx = clozeCtx(it);
    if (P.mode === 'wf') ctx = wfCtx(it);
    if (P.mode === 'ce') ctx = '';
    if (P.mode === 'ef') ctx = '';

    var body = '';
    if (it.ty === 'mcq') {
      var opts = it.o.map(function (o, i) {
        var cls = 'qz-option', letter = 'ABCD'[i];
        if (answered) {
          if (i === it.ai) cls += ' right'; else if (i === P.chosen) cls += ' wrong';
          cls += ' disabled';
        }
        return '<button class="' + cls + '" data-act="pr-ans" data-i="' + i + '" ' + (answered ? 'disabled' : '') + '>' +
          '<span class="letter let-' + letter + '">' + letter + '</span><span>' + esc(o) + '</span></button>';
      }).join('');
      body = '<div class="qz-stem">' + (P.mode === 'read' ? 'Q' + it.src + '. ' : '') + esc(it.q) + '</div>' +
        '<div class="grid mt16" style="gap:10px">' + opts + '</div>';
    } else if (it.ty === 'cloze') {
      var opts2 = it.o.map(function (o, i) {
        var cls = 'qz-option', letter = 'ABCD'[i];
        if (answered) {
          if (i === it.ai) cls += ' right'; else if (i === P.chosen) cls += ' wrong';
          cls += ' disabled';
        }
        return '<button class="' + cls + '" data-act="pr-ans" data-i="' + i + '" ' + (answered ? 'disabled' : '') + '>' +
          '<span class="letter let-' + letter + '">' + letter + '</span><span>' + esc(o) + '</span></button>';
      }).join('');
      body = '<div class="row wrap" style="gap:6px"><span class="sec-tag">🔗 第 ' + it.blankNo + ' 空</span><span class="chip">' + esc(P.meta.cloze.t) + '</span></div>' +
        '<div class="qz-stem mt12">选出最合适的选项填入第 ' + it.blankNo + ' 空</div>' +
        '<div class="grid mt16" style="gap:10px">' + opts2 + '</div>';
    } else if (it.ty === 'wf') {
      body = wfBody(it, answered);
    } else if (it.ty === 'ce') {
      body = ceBody(it, answered);
    } else if (it.ty === 'ef') {
      body = efBody(it, answered);
    }

    var feedback = '';
    if (answered) {
      var isOk = P.chosen === it.ai;
      if (it.ty === 'ce') isOk = P.chosen === 0;
      if (it.ty === 'ef') isOk = P.chosen === 0;
      if (it.ty === 'wf') isOk = P.chosen === 0;
      var okTxt = it.ty === 'ef' ? '找对了！' : it.ty === 'ce' ? '自评完成' : it.ty === 'wf' ? (isOk ? '填对了！' : '') : isOk ? '回答正确 ✓' : '回答错误';
      var expHtml = it.ty === 'ef' ? ('错误在 <b>' + esc(it.bad) + '</b> → 应改为 <b>' + esc(it.good) + '</b>。<br>' + esc(it.e)) :
        it.ty === 'ce' ? ('<b>参考答案：</b>' + esc(it.ref) + '<br><span class="muted">' + esc(it.note) + '</span>') :
        it.ty === 'wf' ? ('正确答案：<b>' + esc(it.ans) + '</b><br>' + esc(it.exp || '')) :
        esc(it.e);
      feedback = '<div class="qz-exp mt12"><div class="mb8">' + (isOk ? '✅ ' : '❌ ') + okTxt + '</div>' + expHtml + '</div>' +
        '<button class="btn block mt16" data-act="pr-next">' + (P.pos + 1 >= P.items.length ? '查看结果' : '下一题 →') + '</button>';
    }

    return '' +
      '<div style="max-width:760px;margin:0 auto">' +
      '<div class="progress-line mb16"><button class="btn plain xs" data-act="pr-exit">← 退出</button>' +
        '<span class="chip brand">' + m.ico + ' ' + m.name + '</span>' +
        '<div class="pbar grow"><i style="width:' + (P.pos / P.items.length * 100) + '%"></i></div>' +
        '<span class="qlabel">' + (P.pos + 1) + ' / ' + P.items.length + '</span></div>' +
      '<div class="card pad">' + ctx + body + feedback + '</div>' +
      (P.mode === 'ce' && !answered ? '<div class="muted small center mt8">写完先自查，再点“查看参考与自评”</div>' : '') +
      '</div>';
  }

  function clozeCtx(it) {
    var cl = P.meta.cloze;
    var paras = cl.body.map(function (para) {
      var out = para.replace(/__\((\d+)\)__/g, function (_, n) {
        var i = +n - 1;
        if (i + 1 === it.blankNo) return '<span class="blank sel-box">第' + n + '空</span>';
        if (i + 1 < it.blankNo) return '<span class="blank filled">✓' + n + '</span>';
        return '<span class="blank">___' + n + '</span>';
      });
      return '<p class="blanks-sent">' + out + '</p>';
    }).join('');
    return '<div class="gram-box mb16 small" style="border-left-color:#0ea56a"><b>全文语境：</b>' + esc(cl.zh) + '</div><div class="reading-pane mb16" style="max-height:30vh"><div class="article">' + paras + '</div></div>';
  }
  function wfCtx(it) {
    var wf = P.meta.wf;
    var filled = P.pos > 0 ? P.items.slice(0, P.pos) : [];
    var boxHtml = wf.box.map(function (w) {
      var used = filled.some(function (f) { return f.ans === w; });
      return '<span class="word-sel ' + (used ? 'used' : '') + '">' + esc(w) + '</span>';
    }).join(' ');
    var text = wf.text.replace(/__\((\d+)\)__/g, function (_, n) {
      var i = +n - 1;
      if (i + 1 === it.n) return '<span class="blank sel-box">请选第' + n + '空</span>';
      var usedW = filled.filter(function (f) { return f.n === i + 1; })[0];
      return '<span class="blank filled">' + (usedW ? usedW.ans : '✓') + '</span>';
    });
    return '<div class="reading-pane mb16"><div class="row mb8 wrap" style="gap:6px"><span class="sec-tag">🧺 选词填空</span><span class="chip">' + esc(wf.t) + '</span></div>' +
      '<div class="small muted mb12">' + esc(wf.intro || '') + '</div>' +
      '<div class="blanks-sent" style="line-height:2.4;margin-bottom:12px">' + text + '</div>' +
      '<div class="gram-box"><b>词库（每词限用一次）：</b><div class="mt8" style="display:flex;gap:8px;flex-wrap:wrap">' + boxHtml + '</div></div></div>';
  }
  function wfBody(it, answered) {
    return '<div class="qz-stem">从上方词库中选择适合第 ' + it.n + ' 空的词</div>' +
      (answered
        ? '<div class="muted small mt8">你的选择：<b>' + esc(P.wfWord || '') + '</b></div>'
        : '<div style="display:flex;gap:8px;flex-wrap:wrap" class="mt12">' + P.meta.wf.box.map(function (w) {
          return '<button class="word-sel" data-act="pr-wf" data-w="' + esc(w) + '">' + esc(w) + '</button>';
        }).join('') + '</div>');
  }
  function ceBody(it, answered) {
    return '<div class="sec-tag">✍️ 汉译英</div>' +
      '<div class="qz-stem mt12">' + esc(it.zh) + '</div>' +
      (answered
        ? '<div class="gram-box mt12" style="border-left-color:var(--ok)"><b>参考答案</b><br>' + esc(it.ref) + '<div class="muted small mt8">' + esc(it.note) + '</div></div>'
        : '<div class="mt12"><textarea class="inp" id="ceInp" rows="3" placeholder="在这里写出你的英文翻译…"></textarea>' +
          '<div class="row mt12 wrap" style="gap:8px">' +
          '<button class="btn ok sm" data-act="pr-ce" data-g="0">我写对了 → 记 3 分</button>' +
          '<button class="btn warn sm" data-act="pr-ce" data-g="1">基本对 → 记 2 分</button>' +
          '<button class="btn bad sm" data-act="pr-ce" data-g="2">不会 / 错 → 记 0 分</button>' +
          '</div></div>');
  }
  function efBody(it, answered) {
    var toks = it.s.split(' ');
    var chipHtml = toks.map(function (t, i) {
      var clean = t.replace(/[^A-Za-z'’-]/g, '');
      if (answered) {
        var isBad = it.bad.toLowerCase().split(' ').indexOf(clean.toLowerCase()) >= 0;
        return '<span class="word-sel" style="' + (isBad ? 'border-color:var(--bad);background:var(--bad-soft);color:var(--bad)' : 'opacity:.6') + '">' + esc(t) + '</span>';
      }
      return '<button class="word-sel" data-act="pr-ef" data-i="' + i + '">' + esc(t) + '</button>';
    }).join(' ');
    return '<div class="row wrap mb12" style="gap:6px"><span class="sec-tag">🔧 改错</span><span class="chip">点击你认为错误的词</span></div>' +
      '<div class="reading-pane center" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;line-height:2.6">' + chipHtml + '</div>' +
      (answered ? '' : '<div class="center mt12"><button class="btn ghost sm" data-act="pr-ef-skip">不会 / 直接看答案</button></div>');
  }

  /* ---------------- 结果页 ---------------- */
  function result() {
    var m = MODE_MAP[P.mode];
    var ok = P.res.filter(function (x) { return x; }).length;
    var total = P.res.length;
    var pct = total ? Math.round(ok / total * 100) : 0;
    var wrongs = P.items.map(function (it, i) {
      if (P.res[i]) return null;
      var why = '';
      if (it.ty === 'ce') why = '参考译文：' + it.ref;
      else if (it.ty === 'ef') why = '错误 ' + it.bad + ' → ' + it.good + '。' + it.e;
      else if (it.ty === 'wf') why = '正确答案：' + it.ans;
      else why = it.e || '';
      return '<div class="li-item"><span class="li-ico" style="background:var(--bad-soft)">✗</span>' +
        '<div><div class="li-txt">' + esc(it.q || (it.ty === 'ce' ? it.zh : it.ty === 'wf' ? '选词第 ' + it.n + ' 空' : it.ty === 'ef' ? it.s : '')) + '</div>' +
        '<div class="li-sub">' + esc(why) + '</div></div></div>';
    }).filter(Boolean).join('');
    var head = total === 0 ? '' : '<h2>' + ok + ' / ' + total + ' 正确（' + pct + '%）</h2>';
    return '<div style="max-width:660px;margin:0 auto" class="center">' +
      '<div class="card pad" style="padding:30px">' +
        '<div style="font-size:52px">' + (pct >= 85 ? '🏆' : pct >= 60 ? '💪' : '🌱') + '</div>' + head +
        (pct >= 85 ? '<p class="muted small">掌握优秀，可以直接挑战全真模考！</p>' : pct >= 60 ? '<p class="muted small">基础不错，把错题弄懂后再来一轮。</p>' : '<p class="muted small">错题是进步的阶梯：先看解析，再回课程重学对应知识点。</p>') +
        '<div class="pbar mt12"><i style="width:' + pct + '%;background:' + (pct >= 60 ? 'var(--ok)' : 'var(--bad)') + '"></i></div>' +
      '</div>' +
      (wrongs ? '<div class="card pad mt16" style="text-align:left"><div style="font-weight:800" class="mb8">错题 / 复习回顾</div>' + wrongs + '</div>' : '') +
      '<div class="row mt16 center" style="justify-content:center;gap:10px">' +
        '<button class="btn soft" data-act="pr-start" data-m="' + P.mode + '">再练一组</button>' +
        '<button class="btn ghost" data-go="practice">返回专项列表</button>' +
        (m && m.need === 'read' ? '' : '') +
        '<button class="btn" data-go="mock">去全真模考 →</button>' +
      '</div></div>';
  }

  /* ---------------- 作答动作 ---------------- */
  Eng.actions['pr-exit'] = function () { P.mode = null; P.items = []; Eng.go('practice'); };
  Eng.actions['pr-ans'] = function (el, d) {
    if (P.chosen !== null || !P.items.length || P.pos >= P.items.length) return;
    var it = P.items[P.pos];
    var i = +d.i;
    P.chosen = i;
    var ok = i === it.ai;
    P.res.push(ok);
    pmRec(P.mode, ok);
    Eng.record({ qn: 1, qk: ok ? 1 : 0 });
    Eng.go('practice');
  };
  Eng.actions['pr-wf'] = function (el, d) {
    if (P.chosen !== null || !P.items.length || P.pos >= P.items.length) return;
    var it = P.items[P.pos];
    P.wfWord = d.w;
    var ok = d.w === it.ans;
    P.chosen = ok ? 0 : 1;
    P.res.push(ok);
    pmRec(P.mode, ok);
    Eng.record({ qn: 1, qk: ok ? 1 : 0 });
    Eng.go('practice');
  };
  Eng.actions['pr-ce'] = function (el, d) {
    if (P.chosen !== null || !P.items.length || P.pos >= P.items.length) return;
    var g = +d.g;
    P.chosen = g;
    var ok = g <= 1;
    P.res.push(ok);
    pmRec(P.mode, ok);
    Eng.record({ qn: 1, qk: ok ? 1 : 0 });
    Eng.go('practice');
  };
  Eng.actions['pr-ef'] = function (el, d) {
    if (P.chosen !== null || !P.items.length || P.pos >= P.items.length) return;
    var it = P.items[P.pos];
    var i = +d.i;
    var word = it.s.split(' ')[i].replace(/[^A-Za-z'’-]/g, '').toLowerCase();
    var badToks = it.bad.toLowerCase().split(' ');
    var ok = badToks.indexOf(word) >= 0;
    P.chosen = ok ? 0 : 1;
    P.res.push(ok);
    pmRec(P.mode, ok);
    Eng.record({ qn: 1, qk: ok ? 1 : 0 });
    Eng.go('practice');
  };
  Eng.actions['pr-ef-skip'] = function () {
    if (P.chosen !== null || !P.items.length || P.pos >= P.items.length) return;
    P.chosen = 1; P.res.push(false);
    pmRec(P.mode, false);
    Eng.record({ qn: 1, qk: 0 });
    Eng.go('practice');
  };
  Eng.actions['pr-next'] = function () {
    if (!P.items.length) return;
    var done = P.pos + 1 >= P.items.length;
    P.pos++; P.chosen = null;
    if (done) {
      var ok = P.res.filter(function (x) { return x; }).length;
      var res = Eng.record({ act: '🎯 ' + (MODE_MAP[P.mode] ? MODE_MAP[P.mode].name : '') + ' ' + ok + '/' + P.res.length + ' 正确' });
      if (res.first) Eng.toast('🔥 今日打卡成功！连续 ' + res.streak + ' 天', 2400);
      Eng.save();
    }
    Eng.go('practice');
  };

  /* ---------------- 写作范文库 ---------------- */
  function writeView() {
    var list = ED.bank2.essays.map(function (es) {
      return '<div class="card pad">' +
        '<div class="row wrap"><span class="sec-tag">📄 写作</span><span class="chip">' + esc(es.t) + '</span></div>' +
        '<p class="small mt12 muted">' + esc(es.req) + '</p>' +
        '<div class="reading-pane mt12"><div class="article" style="white-space:pre-line">' + esc(es.sample) + '</div></div>' +
        '<div class="gram-box mt12 small"><b>💡 得分点：</b>' + esc(es.points) + '</div>' +
      '</div>';
    }).join('');
    return '<button class="btn plain xs mb16" data-act="pr-exit">← 返回</button>' +
      '<div class="hero" style="background:linear-gradient(135deg,#64748b,#0f172a)"><div class="checkin-hero"><span class="flame">📄</span>' +
      '<div class="grow"><h1>写作范文库</h1><p>专升本作文：三段式提纲议论文。先模仿结构，再背诵亮点句</p></div></div></div>' +
      '<div class="grid g1 mt16" style="gap:16px">' + list + '</div>';
  }

  /* ---------------- 入学测评 ---------------- */
  var D = { active: false, items: [], pos: 0, chosen: null, res: [] };
  function startDiag() {
    var pool = [];
    // 5 道基础词汇 + 10 道语法（A/B 级）
    var ww = E.pick(ED.vocab.list.filter(function (w) { return w.lv === 1; }), 5);
    ww.forEach(function (w) {
      var wrong = E.pick(ED.vocab.list.filter(function (x) { return x.lv === 1 && x !== w; }), 3).map(function (x) { return x.m; });
      var o = [w.m].concat(wrong);
      var sc = E.shufChoices(o, 0);
      pool.push({ ty: 'w', word: w, q: '单词 "' + w.w + '" 的意思是？', o: sc.os, ai: sc.ai, e: w.w + '：' + w.m });
    });
    var gq = E.pick(ED.course.quiz.filter(function (q) { return q.lv <= 2; }), 10);
    gq.forEach(function (q) {
      var sc = E.shufChoices(q.o, q.a);
      pool.push({ ty: 'g', q: q.q, o: sc.os, ai: sc.ai, e: q.e });
    });
    D = { active: true, items: E.shuffle(pool), pos: 0, chosen: null, res: [] };
  }
  function diagScreen() {
    if (!D.active) { return '<div class="empty"><div class="big">🧭</div><button class="btn" data-act="diagStart">开始入学测评</button></div>'; }
    if (D.pos >= D.items.length) return diagDone();
    var it = D.items[D.pos];
    var opts = it.o.map(function (o, i) {
      var cls = 'qz-option', letter = 'ABCD'[i];
      if (D.chosen !== null) {
        if (i === it.ai) cls += ' right'; else if (i === D.chosen) cls += ' wrong';
        cls += ' disabled';
      }
      return '<button class="' + cls + '" data-act="dg-ans" data-i="' + i + '" ' + (D.chosen !== null ? 'disabled' : '') + '>' +
        '<span class="letter let-' + letter + '">' + letter + '</span><span>' + esc(o) + '</span></button>';
    }).join('');
    return '<div style="max-width:620px;margin:0 auto">' +
      '<div class="progress-line mb16"><button class="btn plain xs" data-act="dg-exit">← 退出</button>' +
        '<span class="chip brand">🧭 入学测评 · ' + D.items.length + ' 题</span>' +
        '<div class="pbar grow"><i style="width:' + (D.pos / D.items.length * 100) + '%"></i></div></div>' +
      '<div class="card pad">' +
        '<div class="qz-stem">' + (D.pos + 1) + '. ' + esc(it.q) + '</div>' +
        '<div class="grid mt16" style="gap:10px">' + opts + '</div>' +
        (D.chosen !== null ? '<div class="qz-exp mt12">' + esc(it.e) + '</div>' +
          '<button class="btn block mt16" data-act="dg-next">' + (D.pos + 1 >= D.items.length ? '查看测评结果' : '下一题') + '</button>' : '') +
        '<div class="muted tiny center mt12">测评用于估算起始水平，约 2 分钟</div>' +
      '</div></div>';
  }
  function diagDone() {
    var ok = D.res.filter(function (x) { return x; }).length;
    var total = D.res.length;
    var ratio = total ? ok / total : 0;
    var score = Math.round(E.clamp(40 + ratio * 72, 40, 112));
    Eng.S.diag = { score: score, at: Date.now() };
    Eng.record({ qn: total, qk: ok, act: '🧭 入学测评：起始估分约 ' + score + ' 分' });
    Eng.save();
    var ph = E.PHASES[E.phaseOf(score)];
    D.active = false;
    return '<div style="max-width:600px;margin:0 auto" class="center">' +
      '<div class="card pad" style="padding:34px">' +
        '<div style="font-size:52px">🧭</div>' +
        '<h2 class="mt8">测评完成！</h2>' +
        '<p class="muted">正确 ' + ok + ' / ' + total + '</p>' +
        '<div style="margin:18px auto" class="ring" style="--p:' + Math.round(score / 150 * 100) + '"><div class="ring-txt"><b>' + score + '</b><div class="tiny muted">起始估分</div></div></div>' +
        '<p>建议从 <b>' + ph.name + '</b>（' + ph.range + ' 分）开始：先刷 ' + ph.focus + '。</p>' +
        '<div class="row mt20 center" style="justify-content:center;gap:10px">' +
          '<button class="btn" data-go="home">返回首页规划</button>' +
          '<button class="btn ghost" data-act="dg-again">重新测评</button>' +
        '</div></div></div>';
  }
  Eng.actions.diagStart = function () { if (!D.active) startDiag(); D.active = true; Eng.go('practice', { d: 'diag' }); };
  Eng.actions['dg-exit'] = function () { D.active = false; Eng.go('practice'); };
  Eng.actions['dg-again'] = function () { D.active = false; Eng.actions.diagStart(); };
  Eng.actions['dg-ans'] = function (el, d) {
    if (D.chosen !== null) return;
    D.chosen = +d.i;
    D.res.push(D.chosen === D.items[D.pos].ai);
    Eng.go('practice', { d: 'diag' });
  };
  Eng.actions['dg-next'] = function () {
    D.pos++; D.chosen = null;
    Eng.go('practice', { d: 'diag' });
  };
})(window);
</script>
<script>/* ==== ui-mock ==== *//* ============================================================
   全真模考：按河南专升本公共英语 8 部分组卷，满分 150，
   倒计时 + 答题卡 + 自动批改(选择/填空/改错) + 自评(翻译/写作)
   ============================================================ */
(function (g) {
  'use strict';
  var E = g.Engine, ED = g.ED, Eng = g.Eng;
  var esc = Eng.esc;

  var M = { mode: 'start', items: [], pos: 0, timer: null, leftMs: 0, totalMs: 0, report: null };

  var SECS = [
    { k: 'A', name: 'Ⅰ 阅读理解', pts: 2, count: 20 },
    { k: 'B', name: 'Ⅱ 完形填空', pts: 1, count: 20 },
    { k: 'C', name: 'Ⅲ 判断正误', pts: 2, count: 5 },
    { k: 'D', name: 'Ⅳ 英译汉选择', pts: 2, count: 5 },
    { k: 'E', name: 'Ⅴ 选词填空', pts: 3, count: 5 },
    { k: 'F', name: 'Ⅵ 汉译英翻译', pts: 3, count: 5, self: true },
    { k: 'G', name: 'Ⅶ 改错', pts: 2, count: 10 },
    { k: 'H', name: 'Ⅷ 写作', pts: 20, count: 1, self: true }
  ];

  function buildItems() {
    var items = [];
    // A 阅读 4 篇
    var rds = E.pick(ED.bank.reading, 4);
    rds.forEach(function (ps) {
      ps.qs.forEach(function (q, qi) {
        var sc = E.shufChoices(q.o, q.a);
        items.push({ sec: 'A', ty: 'mcq', pts: 2, q: q.q, o: sc.os, ai: sc.ai, e: q.e, ctx: { k: 'read', tx: ps.tx, t: ps.t }, qn: qi + 1, chosen: null });
      });
    });
    // B 完形
    var cl = E.pick(ED.bank.cloze, 1)[0];
    cl.opts.forEach(function (op, i) {
      var sc = E.shufChoices(op, cl.ans[i]);
      items.push({ sec: 'B', ty: 'cloze', pts: 1, blank: i + 1, o: sc.os, ai: sc.ai, e: '结合语境与语法判断', ctx: { k: 'cloze', data: cl }, chosen: null });
    });
    // C 判断
    var tf = E.pick(ED.bank2.tf, 1)[0];
    tf.items.forEach(function (it) {
      items.push({ sec: 'C', ty: 'mcq', pts: 2, q: it.s, o: ['正确（True）', '错误（False）'], ai: it.v ? 0 : 1, e: it.v ? '与短文相符 → True' : '与短文不符 → False', ctx: { k: 'tf', tx: tf.tx, t: tf.t }, chosen: null });
    });
    // D 英译汉
    E.pick(ED.bank2.ec, 5).forEach(function (q) {
      var sc = E.shufChoices(q.o, q.a);
      items.push({ sec: 'D', ty: 'mcq', pts: 2, q: q.en, o: sc.os, ai: sc.ai, e: q.e, chosen: null });
    });
    // E 选词
    var wf = E.pick(ED.bank2.wf, 1)[0];
    [1, 2, 3, 4, 5].forEach(function (n) {
      items.push({ sec: 'E', ty: 'wf', pts: 3, n: n, ans: wf.key[n - 1], ctx: { k: 'wf', data: wf }, chosen: null, val: '' });
    });
    // F 汉译英（自评 3/2/0）
    E.pick(ED.bank2.ce, 5).forEach(function (q) {
      items.push({ sec: 'F', ty: 'ce', pts: 3, zh: q.zh, ref: q.ref, note: q.note, chosen: null, val: '' });
    });
    // G 改错 10
    E.pick(ED.bank2.ef, 10).forEach(function (q) {
      items.push({ sec: 'G', ty: 'ef', pts: 2, s: q.s, bad: q.bad, good: q.good, e: q.e, chosen: null, lock: false });
    });
    // H 写作
    var es = E.pick(ED.bank2.essays, 1)[0];
    items.push({ sec: 'H', ty: 'essay', pts: 20, topic: es.t, req: es.req, sample: es.sample, chosen: null, val: '' });
    return items;
  }

  function secOf(k) { for (var i = 0; i < SECS.length; i++) if (SECS[i].k === k) return SECS[i]; return null; }

  Eng.registerView('mock', function () {
    if (M.mode === 'run') return examPage();
    if (M.mode === 'report' && M.report) return reportPage(M.report);
    return startPage();
  });

  /* ---------------- 开始页 ---------------- */
  function startPage() {
    var mocks = Eng.S.mocks;
    var best = 0; mocks.forEach(function (m) { if (m.total > best) best = m.total; });
    var history = mocks.length ? '<div class="sect"><h3>模考记录</h3></div><div class="grid g-auto">' +
      mocks.slice(-8).reverse().map(function (m) {
        return '<div class="stat-card"><div class="k">' + new Date(m.at).toLocaleDateString('zh-CN') + '</div><div class="v" style="color:' + (m.total >= 120 ? 'var(--ok)' : m.total >= 90 ? 'var(--warn)' : 'var(--bad)') + '">' + m.total + '<small> / 150</small></div>' +
          '<div class="tiny muted">自动 ' + m.auto + ' · 自评 ' + m.self + ' · 用时 ' + Math.round((m.secs || 0) / 60) + ' 分</div></div>';
      }).join('') + '</div>' : '';
    return '' +
      '<div class="hero" style="background:linear-gradient(135deg,#e5484d,#7c3aed)">' +
        '<div class="checkin-hero">' +
          '<span class="flame">📝</span>' +
          '<div class="grow"><h1>全真模拟考试</h1><p>智能组卷 · 河南专升本公共英语真题结构 · 满分 150 分 · 建议用时 150 分钟</p></div>' +
          (mocks.length ? '<div style="text-align:center"><div class="ring sm" style="--p:' + Math.round(best / 150 * 100) + '"><div class="ring-txt"><b style="font-size:18px">' + best + '</b><div class="tiny" style="opacity:.85">历史最佳</div></div></div></div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="grid g2 mt16"><div class="card pad">' +
        '<div class="row wrap"><b>📋 试卷结构</b><span class="chip brand">总分 150</span></div>' +
        '<table class="tbl mt8"><tr><th>部分</th><th>题量</th><th>分值</th></tr>' +
        SECS.map(function (s) { return '<tr><td>' + s.name + '</td><td>' + s.count + '</td><td>' + (s.k === 'H' ? '1 篇 20' : s.pts + ' 分×' + s.count + ' = ' + (s.pts * s.count)) + '</td></tr>'; }).join('') +
        '</table>' +
        '<div class="muted tiny mt8">* Ⅵ 汉译英与 Ⅷ 写作按“参考译文/范文自评”计分（模考结束后评分）。</div>' +
      '</div><div style="display:flex;flex-direction:column;gap:14px">' +
        '<div class="card pad"><b>🎯 使用建议</b><ul class="small muted" style="margin:8px 0 0;padding-left:18px;line-height:2">' +
          '<li>连续 150 分钟，模拟真实考场节奏</li>' +
          '<li>先做阅读/完形等客观题，写作留足 25 分钟</li>' +
          '<li>不确定的题先标记，答完再回头检查</li>' +
          '<li>模考分数是预估分的最强证据</li></ul></div>' +
        '<div class="card pad"><b>⏱ 考试时长</b>' +
          '<div class="row mt12 wrap" style="gap:8px">' +
            [150, 120, 90].map(function (t) {
              return '<button class="btn ' + (Eng.S.set.mockMin === t ? 'soft' : 'ghost') + ' xs" data-act="mk-time" data-t="' + t + '">' + t + ' 分钟</button>';
            }).join('') +
          '</div></div>' +
        '<button class="btn block" data-act="mk-start" style="min-height:54px;font-size:17px">🚀 开始模考</button>' +
        (mocks.length ? '<div class="center"><button class="btn plain xs" data-go="me">查看完整成绩趋势 →</button></div>' : '') +
      '</div></div>' + history;
  }

  /* ---------------- 考试 ---------------- */
  function examPage() {
    var it = M.items[M.pos];
    if (!it) { submit(false); return reportPage(M.report); }
    var all = M.items.length;
    var doneCnt = M.items.filter(function (x) { return x.chosen !== null; }).length;

    // 题号答题卡
    var dots = M.items.map(function (x, i) {
      var cls = 'sdot';
      if (i === M.pos) cls += ' cur';
      if (x.chosen !== null) cls += ' ans';
      return '<button class="' + cls + '" data-act="mk-jump" data-i="' + i + '" title="第 ' + (i + 1) + ' 题">' + (i + 1) + '</button>';
    }).join('');

    var ctxHtml = '';
    if (it.ctx) {
      if (it.ctx.k === 'read') ctxHtml = '<div class="reading-pane mb16"><div class="row mb8 wrap" style="gap:6px"><span class="chip">📖 ' + esc(it.ctx.t) + '</span><span class="chip">阅读 · 每题 2 分</span></div><div class="article"><p>' + esc(it.ctx.tx) + '</p></div></div>';
      if (it.ctx.k === 'tf') ctxHtml = '<div class="reading-pane mb16"><div class="row mb8 wrap" style="gap:6px"><span class="chip">⚖️ ' + esc(it.ctx.t) + '</span></div><div class="article"><p>' + esc(it.ctx.tx) + '</p></div></div>';
      if (it.ctx.k === 'cloze') ctxHtml = clozeText(it);
      if (it.ctx.k === 'wf') ctxHtml = wfText(it);
    }

    var bodyHtml = itemBody(it);
    var escInfo = it.sec === 'A' ? 'Q' + it.qn + ' · ' : it.sec === 'B' ? '第 ' + it.blank + ' 空 · ' : it.sec === 'E' ? '第 ' + it.n + ' 空 · ' : '';

    return '' +
      '<div class="mock-quiz">' +
      '<div class="row wrap mb12" style="gap:8px"><button class="icon-btn" data-act="mk-exit" style="width:34px;height:34px" title="退出模考">✕</button>' +
        '<span class="sec-tag">' + (secOf(it.sec) ? secOf(it.sec).name : '') + '</span>' +
        '<span class="chip">第 ' + (M.pos + 1) + ' / ' + all + ' 题</span>' +
        '<div class="grow"></div>' +
        '<span class="chip warn clock" id="mkClock">⏱ 2:29:59</span>' +
        '<button class="btn sm" data-act="mk-submit">交卷</button></div>' +
      '<div class="card pad">' +
        '<div class="qz-stem small muted" style="font-weight:600">' + escInfo + '</div>' +
        ctxHtml + bodyHtml +
      '</div>' +
      '<div class="answer-sheet"><span class="small muted" style="font-weight:700">答题卡</span>' +
        '<div class="sheet-dots">' + dots + '</div>' +
        '<div class="row" style="flex:0 0 auto;gap:6px"><button class="btn xs ghost" data-act="mk-prev"' + (M.pos === 0 ? ' disabled' : '') + '>‹ 上一题</button>' +
        '<button class="btn xs" data-act="mk-next">' + (M.pos + 1 >= all ? '最后一题' : '下一题 ›') + '</button></div></div>' +
      '<div class="tiny muted center mt8">已作答 ' + doneCnt + ' / ' + all + ' · 写作请预留 25 分钟</div>' +
      '</div>';
  }

  function itemBody(it) {
    if (it.ty === 'mcq') {
      return '<div class="qz-stem">' + esc(it.q) + '</div><div class="grid mt16" style="gap:10px">' +
        it.o.map(function (o, i) {
          var cls = 'qz-option' + (it.chosen === i ? ' sel' : '');
          return '<button class="' + cls + '" data-act="mk-ans" data-i="' + i + '"><span class="letter let-' + 'ABCD'[i] + '">' + 'ABCD'[i] + '</span><span>' + esc(o) + '</span></button>';
        }).join('') + '</div>';
    }
    if (it.ty === 'cloze') {
      return '<div class="qz-stem">请选择第 ' + it.blank + ' 空的正确选项</div><div class="grid mt16" style="gap:10px">' +
        it.o.map(function (o, i) {
          var cls = 'qz-option' + (it.chosen === i ? ' sel' : '');
          return '<button class="' + cls + '" data-act="mk-ans" data-i="' + i + '"><span class="letter let-' + 'ABCD'[i] + '">' + 'ABCD'[i] + '</span><span>' + esc(o) + '</span></button>';
        }).join('') + '</div>';
    }
    if (it.ty === 'wf') {
      return '<div class="qz-stem">为第 ' + it.n + ' 空选择合适单词（每词限一次，可回看修改）</div>' +
        (it.chosen !== null ? '<div class="chip ok mt8">已选：' + esc(it.val) + '</div>' : '') +
        '<div class="mt16" style="display:flex;gap:8px;flex-wrap:wrap">' + it.ctx.data.box.map(function (w) {
          var used = M.items.some(function (x) { return x.sec === 'E' && x !== it && x.val === w; });
          return '<button class="word-sel ' + (used ? 'used' : '') + '" data-act="mk-wf" data-w="' + esc(w) + '"' + (used ? ' disabled' : '') + '>' + esc(w) + '</button>';
        }).join('') + '</div>';
    }
    if (it.ty === 'ce') {
      return '<div class="qz-stem">' + esc(it.zh) + '</div>' +
        '<div class="mt12"><textarea class="inp" id="mkCeInp" rows="3" placeholder="写出你的英文翻译…">' + esc(it.val) + '</textarea></div>' +
        '<div class="row mt12 wrap" style="gap:8px"><span class="small muted">翻译自评（满分 3 分）：</span>' +
          ['完全正确', '基本正确', '未译出/错误'].map(function (t, i) {
            var pt = [3, 2, 0][i];
            return '<button class="btn xs ' + (it.chosen === i ? '' : 'ghost') + (it.chosen === i && pt === 3 ? ' ok' : it.chosen === i && pt === 2 ? ' warn' : it.chosen === i && pt === 0 ? ' bad' : '') + '" data-act="mk-self" data-k="ce" data-g="' + i + '">' + t + ' ' + pt + '分</button>';
          }).join('') +
        '</div>' +
        (it.chosen !== null ? '<div class="chip ok mt8">自评已存：' + ['完全正确','基本正确','未译出/错误'][it.chosen] + '</div>' : '') +
        '<div class="muted tiny mt8">对照自己译文点选档位，系统按 3/2/0 计分</div>';
    }
    if (it.ty === 'essay') {
      return '<div class="row wrap mb12" style="gap:6px"><span class="sec-tag">📄 写作 · 20 分</span></div>' +
        '<div class="qz-stem" style="font-size:15px;font-weight:600">' + esc(it.req) + '</div>' +
        '<div class="mt12"><textarea class="inp" id="mkEssayInp" rows="12" style="font-size:15px;line-height:1.9" placeholder="在这里写作文…">' + esc(it.val) + '</textarea></div>' +
        '<div class="row mt12 wrap" style="gap:8px"><span class="small muted">对照范文自评档位：</span>' +
          [0, 4, 8, 12, 16, 20].map(function (pt, i) {
            return '<button class="btn xs ' + (it.chosen === i ? '' : 'ghost') + (it.chosen === i ? ' soft' : '') + '" data-act="mk-self" data-k="es" data-g="' + i + '">' + pt + '</button>';
          }).join('') +
        '</div>' +
        '<div class="muted tiny mt8">按：内容 7 / 语言 7 / 结构 6 分档自评，交卷后可对照参考范文。</div>';
    }
    if (it.ty === 'ef') {
      var toks = it.s.split(' ');
      var selected = it.chosen;
      return '<div class="qz-stem">请点击句中错误所在词</div>' +
        '<div class="reading-pane center mt16" style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center;line-height:2.7">' +
        toks.map(function (t, i) {
          var clean = t.replace(/[^A-Za-z'’-]/g, '').toLowerCase();
          var cls = 'word-sel';
          if (selected !== null && selected === clean) cls += ' used';
          return '<button class="' + cls + '" data-act="mk-ef" data-i="' + i + '"' + (selected !== null ? ' disabled' : '') + '>' + esc(t) + '</button>';
        }).join('') + '</div>' +
        (selected !== null ? '<div class="chip ok mt8">已标记：' + esc(selected) + '</div>' : '') +
        '<div class="muted tiny mt8">点击一次即锁定该词（2 分）；选错或跳过记 0 分</div>';
    }
    return '';
  }
  function clozeText(it) {
    var cl = it.ctx.data;
    var paras = cl.body.map(function (para) {
      var out = para.replace(/__\((\d+)\)__/g, function (_, n) {
        var i = +n - 1;
        var filled = M.items.filter(function (x) { return x.sec === 'B' && x.blank === i + 1 && x.chosen !== null; })[0];
        if (filled) return '<span class="blank filled">' + esc(filled.o[filled.chosen]) + '</span>';
        if (i + 1 === it.blank) return '<span class="blank sel-box">(' + n + ')</span>';
        return '<span class="blank">(' + n + ')</span>';
      });
      return '<p class="blanks-sent">' + out + '</p>';
    }).join('');
    return '<div class="gram-box mb16 small" style="border-left-color:#0ea56a"><b>提示：</b>' + esc(cl.zh) + '</div><div class="reading-pane mb16"><div class="article">' + paras + '</div></div>';
  }
  function wfText(it) {
    var wf = it.ctx.data;
    var text = wf.text.replace(/__\((\d+)\)__/g, function (_, n) {
      var i = +n - 1;
      var filled = M.items.filter(function (x) { return x.sec === 'E' && x.n === i + 1 && x.chosen !== null; })[0];
      return filled ? '<span class="blank filled">' + esc(filled.val) + '</span>' : '<span class="blank">(' + n + ')</span>';
    });
    return '<div class="reading-pane mb16"><div class="article"><div class="blanks-sent" style="line-height:2.4">' + text + '</div></div></div>';
  }

  /* ---------------- 动作：考试内 ---------------- */
  Eng.actions['mk-time'] = function (el, d) { Eng.S.set.mockMin = +d.t; Eng.save(); Eng.go('mock'); };
  Eng.actions['mk-start'] = function () {
    M.items = buildItems();
    M.pos = 0;
    M.mode = 'run';
    var totalSec = (Eng.S.set.mockMin || 150) * 60;
    M.totalMs = totalSec * 1000;
    M.started = Date.now();
    if (M.timer) clearInterval(M.timer);
    M.timer = setInterval(tick, 1000);
    Eng.go('mock');
    toastClock();
  };
  function tick() {
    var el = document.getElementById('mkClock');
    var left = M.totalMs - (Date.now() - M.started);
    M.leftMs = Math.max(0, left);
    if (el) el.textContent = '⏱ ' + Eng.fmtClock(Math.round(left / 1000));
    if (left <= 0) { clearInterval(M.timer); M.timer = null; submit(false); }
  }
  function toastClock() { tick(); }

  Eng.actions['mk-ans'] = function (el, d) {
    var it = M.items[M.pos];
    it.chosen = +d.i; // 允许回看修改
    Eng.go('mock');
  };
  Eng.actions['mk-wf'] = function (el, d) {
    var it = M.items[M.pos];
    var used = M.items.some(function (x) { return x.sec === 'E' && x !== it && x.val === d.w; });
    if (used) return;
    it.val = d.w; it.chosen = 0;
    Eng.go('mock');
  };
  Eng.actions['mk-ef'] = function (el, d) {
    var it = M.items[M.pos];
    var i = +d.i;
    it.chosen = it.s.split(' ')[i].replace(/[^A-Za-z'’-]/g, '').toLowerCase();
    it.lock = true;
    Eng.go('mock');
  };
  Eng.actions['mk-self'] = function (el, d) {
    var it = M.items[M.pos];
    if (!it) return;
    saveInputs();
    it.chosen = +d.g; // ce: 0..2（3/2/0 分）; essay: 0..5（×4 分）
    Eng.go('mock');
  };
  Eng.actions['mk-jump'] = function (el, d) {
    var i = +d.i;
    if (i < 0 || i >= M.items.length) return;
    saveInputs();
    M.pos = i;
    Eng.go('mock');
  };
  Eng.actions['mk-prev'] = function () { saveInputs(); if (M.pos > 0) { M.pos--; Eng.go('mock'); } };
  Eng.actions['mk-next'] = function () { saveInputs(); if (M.pos < M.items.length - 1) { M.pos++; Eng.go('mock'); } };

  function saveInputs() {
    var it = M.items[M.pos];
    if (!it) return;
    var ce = document.getElementById('mkCeInp');
    if (it.ty === 'ce' && ce) it.val = ce.value;
    var es = document.getElementById('mkEssayInp');
    if (it.ty === 'essay' && es) it.val = es.value;
  }
  Eng.actions['mk-exit'] = function () {
    Eng.modal(
      '<p class="muted small mt8">本次模考已作答 ' + M.items.filter(function (x) { return x.chosen !== null; }).length + ' / ' + M.items.length + ' 题。退出将放弃本次成绩。</p>' +
      '<div class="row mt16" style="gap:10px"><button class="btn soft grow" data-close>继续答题</button>' +
      '<button class="btn bad grow" data-act="mk-abandon">放弃并退出</button></div>',
      { title: '确认退出模考？' }
    );
  };
  Eng.actions['mk-abandon'] = function () {
    Eng.closeModal();
    if (M.timer) clearInterval(M.timer); M.timer = null;
    M.mode = 'start'; M.items = []; M.report = null;
    Eng.go('mock');
  };
  Eng.actions['mk-submit'] = function () {
    saveInputs();
    var undone = M.items.filter(function (x) { return x.chosen === null; }).length;
    var msg = undone > 0
      ? '<p class="muted small mt8">还有 <b>' + undone + '</b> 题未作答（含需自评的翻译/写作）。未答客观题计 0 分。</p>'
      : '<p class="muted small mt8">全部作答完成，确认交卷并核算成绩？</p>';
    Eng.modal(
      msg +
      '<div class="row mt16" style="gap:10px"><button class="btn ghost grow" data-close>再检查一下</button>' +
      '<button class="btn ok grow" data-act="mk-confirm">确认交卷</button></div>',
      { title: '📝 交卷确认' }
    );
  };
  Eng.actions['mk-confirm'] = function () { Eng.closeModal(); submit(true); };

  function submit(auto) {
    if (M.timer) clearInterval(M.timer); M.timer = null;
    var leftMs = Math.max(0, M.totalMs - (Date.now() - M.started));
    var usedSec = Math.round((M.totalMs - leftMs) / 1000);
    var auto = 0, self = 0;
    var secScore = {}; SECS.forEach(function (s) { secScore[s.k] = { pts: 0, ok: 0, n: 0 }; });
    var wrong = [];
    var selfItems = [];

    M.items.forEach(function (it, i) {
      var sc = secScore[it.sec]; sc.n++;
      var correct = false, got = 0, max = it.pts;
      if (it.ty === 'mcq' || it.ty === 'cloze') {
        correct = it.chosen === it.ai;
        got = correct ? it.pts : 0;
        if (!correct && it.chosen !== null) wrong.push({ i: i, it: it });
        else if (it.chosen === null) wrong.push({ i: i, it: it });
      } else if (it.ty === 'wf') {
        correct = it.val === it.ans;
        got = correct ? it.pts : 0;
        if (!correct) wrong.push({ i: i, it: it });
      } else if (it.ty === 'ef') {
        var badToks = it.bad.toLowerCase().split(' ');
        correct = it.chosen !== null && badToks.indexOf(it.chosen) >= 0;
        got = correct ? it.pts : 0;
        if (!correct) wrong.push({ i: i, it: it });
      } else if (it.ty === 'ce') {
        var g = it.chosen; // 0 完全 1 基本 2 不会
        if (g === null || g === undefined) g = 2;
        got = [3, 2, 0][g];
        self += got; selfItems.push({ it: it, got: got, max: 3, g: g });
        sc.pts += got; sc.ok += got === 3 ? 1 : 0;
        return;
      } else if (it.ty === 'essay') {
        var b = it.chosen; // 0..5 档 ×4
        if (b === null || b === undefined) b = 0;
        got = b * 4; self += got; selfItems.push({ it: it, got: got, max: 20 });
        sc.pts += got; return;
      }
      auto += got;
      sc.pts += got;
      if (correct) sc.ok++;
    });

    var total = Math.min(150, auto + self);
    // 保存自评结果供展示
    M.items.forEach(function (it) {
      if (it.ty === 'ce' && (it.chosen === null || it.chosen === undefined)) it.chosen = 2;
      if (it.ty === 'essay' && (it.chosen === null || it.chosen === undefined)) it.chosen = 0;
    });

    Eng.S.mocks = Eng.S.mocks || [];
    Eng.S.mocks.push({ at: Date.now(), total: total, auto: auto, self: self, secs: usedSec, type: '全真模考' });
    Eng.save();
    Eng.record({ mock: 1, act: '📝 全真模考 ' + total + '/150（自动 ' + auto + ' + 自评 ' + self + '）' });
    var est = E.estimate(Eng.S);
    Eng.toast(total >= 120 ? '🎉 模考 ' + total + ' 分，冲刺满分！' : '📝 模考 ' + total + ' 分，预估分 ' + est, 2600);

    M.report = { total: total, auto: auto, self: self, usedSec: usedSec, secScore: secScore, wrong: wrong, selfItems: selfItems };
    M.mode = 'report';
    M.items = [];
    Eng.go('mock');
  }

  /* ---------------- 成绩单 ---------------- */
  function reportPage(r) {
    var pct = Math.round(r.total / 150 * 100);
    var grade = r.total >= 140 ? '🏆 满分选手候选' : r.total >= 120 ? '🎯 优秀（可冲满分）' : r.total >= 100 ? '💪 良好（继续专项）' : r.total >= 80 ? '🌱 及格（回补基础）' : '📖 还需打牢基础';
    var rows = SECS.map(function (s) {
      var d = r.secScore[s.k];
      if (!d) return '';
      var allMax = s.pts * s.count;
      return '<tr><td>' + s.name + '</td><td>' + d.ok + '/' + d.n + '</td><td><b>' + d.pts + '</b> / ' + allMax + '</td></tr>';
    }).join('');

    var wrongHtml = '';
    if (r.wrong.length) {
      wrongHtml = '<div class="sect"><h3>错题回看</h3></div><div class="card pad" style="text-align:left">' + r.wrong.map(function (w) {
        var it = w.it;
        var why;
        if (it.ty === 'cloze' || it.ty === 'mcq') why = '正确答案：' + it.o[it.ai] + '。<br>' + (it.e || '');
        else if (it.ty === 'wf') why = '正确答案：' + it.ans + '。';
        else if (it.ty === 'ef') why = '错误 ' + it.bad + ' → 应改为 ' + it.good + '。<br>' + it.e;
        else why = '';
        var qtxt = it.ty === 'ef' ? it.s : it.q || ('选词第 ' + it.n + ' 空');
        return '<div class="li-item"><span class="li-ico" style="background:var(--bad-soft)">✗</span><div><div class="li-txt">' + esc(qtxt) + '</div><div class="li-sub">' + why + '</div></div></div>';
      }).join('') + '</div>';
    }

    var selfHtml = '';
    if (r.selfItems && r.selfItems.length) {
      selfHtml = '<div class="sect"><h3>翻译与作文自评</h3></div><div class="card pad" style="text-align:left">' + r.selfItems.map(function (sx) {
        var it = sx.it;
        if (it.ty === 'ce') return '<div class="li-item"><span class="li-ico" style="background:' + (sx.got === 3 ? 'var(--ok-soft)' : 'var(--warn-soft)') + '">' + sx.got + '</span>' +
          '<div><div class="li-txt">' + esc(it.zh) + '</div><div class="li-sub">参考译文：' + esc(it.ref) + '</div></div></div>';
        return '<div class="li-item"><span class="li-ico" style="background:var(--brand-soft)">' + sx.got + '</span><div><div class="li-txt">作文《' + esc(it.topic) + '》</div>' +
          '<div class="li-sub">范文参考：' + esc(it.sample.slice(0, 120)) + '…（范文全文见“专项-写作范文库”）</div></div></div>';
      }).join('') + '</div>';
    }

    return '' +
      '<div style="max-width:720px;margin:0 auto">' +
      '<div class="result-hero"><div class="tiny" style="opacity:.85">河南专升本英语 · 全真模考成绩</div>' +
        '<div class="big-num">' + r.total + '<span style="font-size:20px"> / 150</span></div>' +
        '<div class="mt8">' + grade + '</div>' +
        '<div class="row mt16 center" style="justify-content:center;gap:10px">' +
          '<div class="chip" style="background:rgba(255,255,255,.18);color:#fff">自动作答 ' + r.auto + ' 分</div>' +
          '<div class="chip" style="background:rgba(255,255,255,.18);color:#fff">自评 ' + r.self + ' 分</div>' +
          '<div class="chip" style="background:rgba(255,255,255,.18);color:#fff">用时 ' + Math.round(r.usedSec / 60) + ' 分钟</div>' +
        '</div></div>' +
      '<div class="card pad mt16" style="text-align:left"><div style="font-weight:800" class="mb8">分项得分</div><table class="tbl"><tr><th>部分</th><th>正确</th><th>得分</th></tr>' + rows + '</table></div>' +
      wrongHtml + selfHtml +
      '<div class="row mt20" style="gap:10px">' +
        '<button class="btn grow" data-act="mk-start">再考一套</button>' +
        '<button class="btn ghost grow" data-go="home">返回首页</button>' +
      '</div>' +
      '<div class="card pad mt16 small muted">📌 建议：模考 <b>100 分以下</b> → 词汇/语法回炉；<b>100-120</b> → 专项刷题 + 错题复盘；<b>120+</b> → 限时训练 + 作文润色冲刺满分。</div>' +
      '</div>';
  }
})(window);
</script>
<script>/* ==== ui-plan ==== *//* ============================================================

(function (g) {

  var STAGE_DEF = [

      weekly: ['周一/周三/周五：阅读理解 1 篇', '周二/周四：完形填空 1 段(10 空)', '周六：词义测验 20 题', '周日：本周复习 + 学习复盘'],
      mid: '两周做 1 次“不计时”完整模考，熟悉题型结构',
      tasks: [
        '完成 Tier1「基础重建」词书一轮去重记忆',
        '学完 A1-A6 六节语法课并全部通过测验',
        '阅读理解累计 6 篇 + 完形 6 段',
        '通关 A 级随堂测验(≥60%)',
        '完成 1~2 次全真模考(先不追求时长)',
        '打卡≥20 天，形成学习习惯'
      ] },
    { name: 'P2 核心突破', from: 80, to: 110, color: '#0ea56a', weeks: 5,
      head: '把从句与完成时打通 + 阅读量起来',
      daily: ['单词：tier2 每天 20 新词 + 复习', '语法：每天 1 节 B 级课', '专项：每天 12 题(阅读+判断正误混练)'],
      weekly: ['周一至周五：每天 1 篇阅读或判断', '周三：完形 1 段(目标 75%+)', '周六：语法闯关 10 题', '周日：错题复盘 + 复习'],
      mid: '每 10 天 1 次全真模考，目标 90→105 分',
      tasks: [
        'Tier2「高中核心词」掌握到 80% 以上',
        '学完 B1-B6 并全部通过测验',
        '阅读累计 15 篇 / 判断正误 5 篇',
        '完形正确率稳定 ≥75%',
        '模考 2 次，分数进入 90~105 区间'
      ] },
    { name: 'P3 进阶强化', from: 110, to: 135, color: '#f59e0b', weeks: 5,
      head: '按真题八题型专项，补齐弱项',
      daily: ['单词：tier3 每天 20 新词 + 复习', '专项：每天 15 题(翻译/改错重点) ', '写作：每周背 1 篇范文结构'],
      weekly: ['周一/三/五：英译汉选择 + 选词填空', '周二/四：汉译英 6 句 + 改错 6 题', '周六：阅读+完形一套计时', '周日：作文仿写 1 篇'],
      mid: '每两周 1 次全真模考(120 分钟)，目标 115→130',
      tasks: [
        'Tier3「专升本高频词」完成一轮',
        '学完 C1-C6 拔高语法课',
        '汉译英 / 改错专项正确率 ≥85%',
        '选词填空 / 英译汉选择稳定满分',
        '作文仿写 5 篇 + 复盘 2 次模考'
      ] },
    { name: 'P4 满分冲刺', from: 135, to: 150, color: '#e5484d', weeks: 4,
      head: '错题清零 + 限时节奏 + 作文亮点句',
      daily: ['单词：滚动复习把到期清零', '错题：改写昨天所有错题', '作文：背 2 个亮点句型'],
      weekly: ['周一/三/五：分块计时训练(阅读/完形/填空)', '周二/四：翻译+改错限时', '周六：全真模考 150 分钟', '周日：错题全清 + 范文回顾'],
      mid: '保证 3 次以上 150 分钟全真模考，冲刺 140+',
      tasks: [
        '全部词书滚动复习到期清零',
        '薄弱语法点按错题驱动重学',
        '模考 ≥3 次，2 次达到 140+',
        '作文 5 篇成稿，语法错误率 <5%',
        '限时节奏：150 分钟分配稳定'
      ] }
  ];

  function plan() { return Eng.S.plan; }

  function buildPlan() {
    var diag = (Eng.S.diag && Eng.S.diag.score) || 50;
    var dailyMin = Eng.S.set.goalMin || 30;
    var factor = dailyMin < 30 ? 1.4 : (dailyMin <= 45 ? 1 : 0.82);
    var stages = STAGE_DEF.map(function (s) {
      return { name: s.name, from: s.from, to: s.to, color: s.color, weeks: Math.max(2, Math.round(s.weeks * factor)),
        head: s.head, daily: s.daily.slice(), weekly: s.weekly.slice(), mid: s.mid, tasks: s.tasks.slice() };
    });
    // 计算起止日期
    var start = new Date();
    var cum = 0;
    stages.forEach(function (s) {
      s.startKey = E.dateKey(E.addDays(start, cum * 7));
      s.endKey = E.dateKey(E.addDays(start, (cum + s.weeks) * 7 - 1));
      cum += s.weeks;
    });
    Eng.S.plan = { created: E.dateKey(), diagScore: diag, dailyMin: dailyMin, totalWeeks: cum, stages: stages, done: {} };
    Eng.save();
    return Eng.S.plan;
  }
  function ensurePlan() {
    if (!Eng.S.plan || !Eng.S.plan.stages || Eng.S.plan.stages.length !== STAGE_DEF.length) buildPlan();
    return Eng.S.plan;
  }

  /* ---------- 自动进度(基于真实学习数据) ---------- */
  function wsOf() {
    var list = ED.vocab.list, lv = [0, 0, 0, 0], kn = [0, 0, 0, 0];
    list.forEach(function (w, i) {
      lv[w.lv]++; if (E.wordKnown(Eng.S.vocab[i])) kn[w.lv]++;
    });
    return { lv: lv, kn: kn, all: list.length, known: kn[1] + kn[2] + kn[3] };
  }
  function lessonsDone(lv) { return ED.course.list.filter(function (l) { return l.lv === lv && Eng.S.lessons[l.id] && Eng.S.lessons[l.id].done; }).length; }
  function lessonsOf(lv) { return ED.course.list.filter(function (l) { return l.lv === lv; }).length; }
  function mstatN(ids) { var n = 0; ids.forEach(function (id) { var s = (Eng.S.mstats || {})[id]; if (s) n += s.n; }); return n; }
  function mockBest() { var b = 0; (Eng.S.mocks || []).forEach(function (m) { if (m.total > b) b = m.total; }); return b; }

  function stageProgress(i) {
    var ws = wsOf();
    if (i === 0) {
      var t1 = ws.lv[1] || 1;
      return Math.round((ws.kn[1] / t1) * 40 + (lessonsDone(1) / Math.max(1, lessonsOf(1))) * 30 + Math.min(1, mstatN(['read']) / 12) * 30);
    }
    if (i === 1) {
      var t2 = ws.lv[2] || 1;
      return Math.round((ws.kn[2] / t2) * 40 + (lessonsDone(2) / Math.max(1, lessonsOf(2))) * 30 + Math.min(1, (mstatN(['read', 'tf', 'cloze']) - 8) / 25) * 30);
    }
    if (i === 2) {
      var t3 = ws.lv[3] || 1;
      return Math.round((ws.kn[3] / t3) * 40 + (lessonsDone(3) / Math.max(1, lessonsOf(3))) * 30 + Math.min(1, mstatN(['ec', 'wf', 'ce', 'ef']) / 30) * 30);
    }
    // P4：整体检验
    var best = mockBest();
    return Math.round(Math.min(1, ws.known / 1500) * 30 + Math.min(1, lessonsDone(1) + lessonsDone(2) + lessonsDone(3) / Math.max(1, ED.course.list.length)) * 20 + Math.min(1, best / 150) * 50);
  }

  /* ---------- 视图 ---------- */
  Eng.registerView('plan', function () {
    var p = ensurePlan();
    var est = E.estimate(Eng.S);
    var ws = wsOf();
    var curStage = E.phaseOf(est);

    var overallPct = Math.round(Math.max(0, Math.min(1, (est - p.stages[0].from) / (150 - p.stages[0].from))) * 100);

    var stageCards = p.stages.map(function (s, i) {
      var prog = stageProgress(i);
      var isCur = i === curStage;
      var cls = isCur ? '' : '';
      var tasksHtml = s.tasks.map(function (t, j) {
        var key = 's' + i + 't' + j;
        var done = !!(p.done && p.done[key]);
        return '<label class="li-item" style="cursor:pointer">' +
          '<input type="checkbox" data-act="plan-toggle" data-key="' + key + '" ' + (done ? 'checked' : '') + ' style="width:18px;height:18px;accent-color:' + s.color + '">' +
          '<div class="li-txt ' + (done ? 'muted" style="text-decoration:line-through' : '') + '">' + esc(t) + '</div></label>';
      }).join('');
      var dailyHtml = s.daily.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('');
      var weeklyHtml = s.weekly.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('');

      return '<div class="card pad" style="border-top:5px solid ' + s.color + '">' +
        '<div class="row wrap">' +
          '<span class="chip" style="background:' + s.color + '22;color:' + s.color + ';font-weight:800">' + s.name + '</span>' +
          '<span class="chip">' + s.from + ' → ' + s.to + ' 分</span>' +
          '<span class="chip">约 ' + s.weeks + ' 周</span>' +
          (isCur ? '<span class="chip warn" style="margin-left:auto">📍 当前阶段</span>' : '') +
        '</div>' +
        '<p class="small muted mt8">' + esc(s.head) + '</p>' +
        '<div class="row mt8"><span class="small muted">阶段进度</span><div class="pbar grow"><i style="width:' + prog + '%;background:' + s.color + '"></i></div><b class="small">' + prog + '%</b></div>' +
        '<div class="grid g2 mt12" style="gap:10px">' +
          '<div class="gram-box" style="border-left-color:' + s.color + '"><b style="font-size:13px">📌 每日安排</b><ul class="small" style="margin:8px 0 0;padding-left:18px;line-height:2">' + dailyHtml + '</ul>' +
            '<div class="tiny muted mt8">' + esc(s.mid) + '</div></div>' +
          '<div class="gram-box"><b style="font-size:13px">🗓 每周规划</b><ul class="small" style="margin:8px 0 0;padding-left:18px;line-height:2">' + weeklyHtml + '</ul></div>' +
        '</div>' +
        '<div class="hr"></div>' +
        '<b style="font-size:13.5px">✅ 阶段关键任务(点勾完成)</b>' +
        '<div>' + tasksHtml + '</div>' +
      '</div>';
    }).join('');

    // 时间轴
    var tl = p.stages.map(function (s, i) {
      var state = i < curStage ? 'pass' : (i === curStage ? 'on' : '');
      return '<div class="p-node"><div class="' + (state ? 'p-dot ' + state : 'p-dot') + '">' + (state === 'pass' ? '✓' : (i + 1)) + '</div>' +
        '<div class="p-name">' + s.name + '</div><div class="p-goal">' + s.from + '→' + s.to + '</div>' +
        '<div class="tiny muted">' + s.startKey.slice(5) + ' ~ ' + s.endKey.slice(5) + '</div></div>';
    }).join('');

    return '' +
      '<div class="hero" style="background:linear-gradient(135deg,#4f46e5,#0ea5e9)">' +
        '<div class="checkin-hero">' +
          '<span class="flame">🧭</span>' +
          '<div class="grow"><h1>你的进阶路线 · 高考 50 → 专升本 150</h1>' +
          '<p>起点分 ' + (p.diagScore || 50) + ' · 当前预估 ' + est + ' 分 · 每天 ' + p.dailyMin + ' 分钟 · 预计 ' + p.totalWeeks + ' 周完成</p></div>' +
          '<button class="btn xs" data-act="plan-rebuild" style="background:rgba(255,255,255,.18)">↻ 重新定制</button>' +
        '</div>' +
        '<div class="pbar mt16" style="background:rgba(255,255,255,.25)"><i style="width:' + overallPct + '%;background:#fff"></i></div>' +
      '</div>' +

      '<div class="card pad mt16"><div class="phase mt8">' + tl + '</div></div>' +

      '<div class="sect"><h3>阶段分解 · 从 50 一步步到 150</h3>' +
        '<span class="muted small">每个阶段的“阶段进度”由你的实际学习数据自动更新</span></div>' +
      '<div class="grid g1" style="gap:16px">' + stageCards + '</div>' +

      '<div class="sect"><h3>总学习账本</h3></div>' +
      '<div class="grid g4">' +
        '<div class="card stat-card"><div class="k">📖 累计词汇</div><div class="v">' + ws.known + '<small>/' + ws.all + '</small></div></div>' +
        '<div class="card stat-card"><div class="k">✏️ 语法课</div><div class="v">' + (lessonsDone(1) + lessonsDone(2) + lessonsDone(3)) + '<small>/' + ED.course.list.length + '</small></div></div>' +
        '<div class="card stat-card"><div class="k">🎯 刷题</div><div class="v">' + (Eng.S.stats.qn || 0) + '<small>题</small></div></div>' +
        '<div class="card stat-card"><div class="k">📝 模考最佳</div><div class="v">' + mockBest() + '<small>/150</small></div></div>' +
      '</div>' +

      '<div class="card pad mt16 small muted">' +
        '<b>计划会自动调整吗？</b> 会的。每当你完成词书、语法课、专项或模考，“阶段进度”与“当前预估分”都会变化；建议每周六看一次“我的”页热力图与模考趋势，若某阶段连续 2 周 <60%，把该阶段的“每日背新词”减半、多留时间复习与错题。' +
      '</div>';
  });

  Eng.actions['plan-toggle'] = function (el, d) {
    var p = ensurePlan();
    p.done = p.done || {};
    p.done[d.key] = !!(el.checked);
    Eng.save();
    if (el.checked) Eng.toast('✅ 完成一项，继续加油！');
  };
  Eng.actions['plan-rebuild'] = function () {
    Eng.modal(
      '<p class="muted small mt8">重新定制将按你当前的起点分与每日时长重排阶段/周计划，已勾选的任务状态会保留。</p>' +
      '<div class="row mt16" style="gap:10px"><button class="btn ghost grow" data-close>取消</button>' +
      '<button class="btn ok grow" data-act="plan-rebuild-yes">重新生成</button></div>',
      { title: '🔄 重新定制学习计划' });
  };
  Eng.actions['plan-rebuild-yes'] = function () {
    Eng.closeModal();
    buildPlan();
    Eng.go('plan');
    Eng.toast('✅ 已按你的进度重新定制计划');
  };
})(window);
</script>
<script>/* ==== ui-me ==== *//* ============================================================
   我的：统计总览 · 打卡热力图 · 成绩趋势 · 成就 · 目标设置 · 数据
   ============================================================ */
(function (g) {
  'use strict';
  var E = g.Engine, ED = g.ED, Eng = g.Eng;
  var esc = Eng.esc;

  Eng.registerView('me', function () { return meView(); });

  function totals() {
    var S = Eng.S, days = S.days;
    var sec = 0, totalQn = 0, totalQk = 0, tasks = 0, daysN = Object.keys(days).length;
    var longest = 0, run = 0, prev = null;
    var keys = Object.keys(days).sort();
    keys.forEach(function (k) {
      var d = days[k];
      sec += d.sec || 0; totalQn += d.qn || 0; totalQk += d.qk || 0; tasks += d.tasks || 0;
      if (prev === null || E.diffDays(k, prev) === 1) { run++; } else { run = 1; }
      if (run > longest) longest = run;
      prev = k;
    });
    return { sec: sec, totalQn: totalQn, totalQk: totalQk, tasks: tasks, daysN: daysN, longest: longest };
  }

  function achievements() {
    var S = Eng.S, t = totals(), ws = Eng.wordState(), lessonsDone = ED.course.list.filter(function (l) { var s = S.lessons[l.id]; return s && s.done; }).length;
    var mockBest = 0; (S.mocks || []).forEach(function (m) { if (m.total > mockBest) mockBest = m.total; });
    var defs = [
      { id: 's1', ico: '🌱', name: '初次打卡', cond: function () { return t.daysN >= 1; } },
      { id: 's7', ico: '🔥', name: '连续 7 天', cond: function () { return t.longest >= 7; } },
      { id: 's30', ico: '⚡', name: '连续 30 天', cond: function () { return t.longest >= 30; } },
      { id: 'w50', ico: '📖', name: '掌握 50 词', cond: function () { return ws.known >= 50; } },
      { id: 'w200', ico: '📚', name: '掌握 200 词', cond: function () { return ws.known >= 200; } },
      { id: 'wall', ico: '🏆', name: '全词书掌握', cond: function () { return ws.known >= ws.total - 1; } },
      { id: 'l6', ico: '✏️', name: '语法 6 课', cond: function () { return lessonsDone >= 6; } },
      { id: 'l12', ico: '✒️', name: '语法 12 课', cond: function () { return lessonsDone >= 12; } },
      { id: 'lall', ico: '🎓', name: '语法全通关', cond: function () { return lessonsDone >= ED.course.list.length; } },
      { id: 'm1', ico: '📝', name: '首套模考', cond: function () { return (S.mocks || []).length >= 1; } },
      { id: 'm120', ico: '🎯', name: '模考 120+', cond: function () { return mockBest >= 120; } },
      { id: 'm140', ico: '🚀', name: '模考 140+', cond: function () { return mockBest >= 140; } },
      { id: 'diag', ico: '🧭', name: '完成入学测评', cond: function () { return !!S.diag; } },
      { id: 'q500', ico: '🛡️', name: '刷题 500 道', cond: function () { return S.stats.qn >= 500; } }
    ];
    S.badges = S.badges || {};
    defs.forEach(function (b) {
      if (b.cond() && !S.badges[b.id]) S.badges[b.id] = Date.now();
    });
    var unlocked = defs.filter(function (b) { return S.badges[b.id]; }).length;
    Eng.save();
    return { defs: defs, unlocked: unlocked };
  }

  function heatHTML() {
    var hm = E.heatmap(Eng.S.days);
    var prevM = -1;
    var cols = hm.map(function (col, ci) {
      var d0 = col[0];
      var mk = +d0.k.split('-')[1];
      var label = '';
      if (mk !== prevM) { label = '<div class="tiny muted" style="height:14px">' + mk + '月</div>'; prevM = mk; }
      var cells = col.map(function (c) {
        if (c.lvl < 0) return '<div class="cell" style="opacity:0"></div>';
        var cls = c.lvl > 0 ? ' l' + c.lvl : '';
        return '<div class="cell' + cls + (c.today ? ' today' : '') + '" title="' + c.k + '"></div>';
      }).join('');
      return '<div class="col">' + label + cells + '</div>';
    }).join('');
    return '<div class="heat">' + cols + '</div>';
  }

  function meView() {
    var S = Eng.S, t = totals();
    var ws = Eng.wordState(), est = E.estimate(S);
    var st = E.streak(S.days);
    var ach = achievements();
    var lessonsDone = ED.course.list.filter(function (l) { var s = S.lessons[l.id]; return s && s.done; }).length;
    var acc = t.totalQn ? Math.round(t.totalQk / t.totalQn * 100) : 0;
    var mockBest = 0; (S.mocks || []).forEach(function (m) { if (m.total > mockBest) mockBest = m.total; });

    // 7 日柱状
    var bars = '';
    for (var i = 6; i >= 0; i--) {
      var d = Eng.S.days[E.dayKey(-i)];
      var val = ((d && d.sec) || 0) / 60;
      var hgt = Math.min(100, val / (S.set.goalMin || 30) * 100);
      bars += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">' +
        '<div style="width:14px;border-radius:5px;background:linear-gradient(180deg,#4f46e5,#a5b0f6);height:' + Math.max(2, hgt) + 'px"></div>' +
        '<span class="tiny muted">' + (i === 0 ? '今' : ['日', '一', '二', '三', '四', '五', '六'][E.parseKey(E.dayKey(-i)).getDay()]) + '</span></div>';
    }

    // 模考趋势
    var trendHtml = '';
    var mocks = S.mocks || [];
    if (mocks.length) {
      var mx = 150;
      var pts = mocks.map(function (m) {
        var x = 8, y = 96 - Math.round(m.total / mx * 80);
        return { x: x, y: y, v: m.total };
      });
      // 简单 SVG 折线
      var path = pts.map(function (p, i) { return (i ? ' L' : 'M') + (20 + i * 46) + ' ' + p.y; }).join('');
      var labels = pts.map(function (p, i) {
        return '<text x="' + (20 + i * 46) + '" y="112" font-size="9" fill="#8a8fa8" text-anchor="middle">' + p.v + '</text>';
      }).join('');
      var circs = pts.map(function (p, i) {
        return '<circle cx="' + (20 + i * 46) + '" cy="' + p.y + '" r="4" fill="#4f46e5"><title>' + p.v + '/150</title></circle>';
      }).join('');
      var W = Math.max(120, 20 + (pts.length - 1) * 46 + 20);
      trendHtml = '<div class="card pad"><div style="font-weight:800" class="mb8">模考成绩趋势（' + mocks.length + ' 次）</div>' +
        '<svg viewBox="0 0 ' + W + ' 120" style="width:100%;max-width:560px;height:auto"><line x1="10" y1="96" x2="' + (W - 8) + '" y2="96" stroke="#eceef7" stroke-width="2"/>' +
        '<path d="' + path + '" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>' + circs + labels + '</svg>' +
        '<div class="tiny muted">最新一次：' + mocks[mocks.length - 1].total + '/150</div></div>';
    }

    var badgesHtml = ach.defs.map(function (b) {
      var on = !!S.badges[b.id];
      return '<div class="badge-item ' + (on ? '' : 'locked') + '"><div class="b-ico">' + (on ? b.ico : '🔒') + '</div><b>' + b.name + '</b></div>';
    }).join('');

    return '' +
      '<div class="hero" style="background:linear-gradient(135deg,#334155,#0f172a)">' +
        '<div class="checkin-hero">' +
          '<div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#f59e0b,#f43f5e);display:flex;align-items:center;justify-content:center;font-size:30px;flex:0 0 64px;box-shadow:0 8px 20px rgba(0,0,0,.25)">' + esc((S.user.name || '同')[0]) + '</div>' +
          '<div class="grow"><h1>' + esc(S.user.name || '同学') + ' 的学习档案</h1>' +
          '<p>连续 ' + st + ' 天 · 累计打卡 ' + t.daysN + ' 天 · 最长连击 ' + t.longest + ' 天</p></div>' +
          '<button class="btn xs" data-act="me-name" style="background:rgba(255,255,255,.16)">✏️ 改名</button>' +
        '</div>' +
      '</div>' +

      '<div class="grid g4 mt16">' +
        stat('📖', '已掌握词汇', ws.known, '/ ' + ws.total, 'est' in {} ? 0 : 0) +
        stat('⏱', '累计学习', Math.round(t.sec / 3600 * 10) / 10, '小时', 0) +
        stat('🎯', '题目正确率', acc, '%（' + t.totalQn + ' 题）', 0) +
        stat('📝', '预估分', est, '/ 150', 0) +
      '</div>' +

      '<div class="card pad mt16"><div class="row wrap"><b>🎯 向满分进发</b><span class="chip brand" style="margin-left:auto">' + est + ' / 150</span></div>' +
        '<div class="pbar mt12"><i style="width:' + Math.round(est / 150 * 100) + '%"></i></div>' +
        '<div class="row mt8 tiny muted">起步 50 分 → 每掌握一层词汇、通关一组语法、刷完一轮专项、多做一次模考，预估分都会上移。</div></div>' +

      '<div class="sect"><h3>打卡日历</h3><span class="chip">🔥 ' + st + ' 连击</span></div>' +
      '<div class="card pad">' + heatHTML() +
        '<div class="heat-legend mt8">少 <span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span> 多' +
        '<span style="margin-left:auto">今日 <span class="cell today"></span></span></div>' +
        '<div class="hr"></div><div class="row wrap"><b class="small">最近 7 天学习时长（分钟/天）</b></div>' +
        '<div class="row mt12" style="align-items:flex-end;height:110px">' + bars + '</div>' +
      '</div>' +

      '<div class="sect"><h3>学习总览</h3></div>' +
      '<div class="grid g2">' +
        '<div class="card pad"><div class="k muted small" style="font-weight:700">📊 各维度进度</div>' +
          oneBar('词汇掌握', ws.known, ws.total, '#0ea5e9') +
          oneBar('语法课程', lessonsDone, ED.course.list.length, '#7c3aed') +
          oneBar('练习正确率', acc, 100, '#0ea56a') +
          '<div class="muted tiny mt8">新学词 ' + S.stats.wNew + ' · 复习卡 ' + S.stats.reviews + ' · 模考 ' + (S.mocks || []).length + ' 次</div></div>' +
        '<div class="card pad"><div class="k muted small" style="font-weight:700">🏅 成就 · ' + ach.unlocked + '/' + ach.defs.length + '</div>' +
          '<div class="grid g3 mt8">' + badgesHtml + '</div></div>' +
      '</div>' + trendHtml +

      '<div class="sect"><h3>目标设置</h3></div>' +
      '<div class="card pad">' +
        '<div class="row wrap" style="gap:8px">' +
          goalCtl('每日新词', S.set.goalW, [10, 20, 30, 40, 60], 'me-gw') +
          goalCtl('每日题量', S.set.goalQ, [10, 20, 30, 50], 'me-gq') +
          goalCtl('每日时长', S.set.goalMin, [15, 30, 45, 60, 90], 'me-gm') +
        '</div>' +
        '<div class="tiny muted mt12">学习目标影响首页“今日任务”进度条，保持“跳一跳够得着”的量最有动力。</div>' +
      '</div>' +

      '<div class="sect"><h3>数据与备份</h3></div>' +
      '<div class="card pad">' +
        '<p class="small muted">所有学习数据保存在本机浏览器（localStorage）。清理 Safari 数据前请先导出备份；换 iPad / 手机可用导入继续学习。</p>' +
        '<div class="row mt12 wrap" style="gap:8px">' +
          '<button class="btn soft sm" data-act="me-export">⬇️ 导出备份</button>' +
          '<button class="btn ghost sm" data-act="me-import">⬆️ 导入备份</button>' +
          '<button class="btn bad sm" data-act="me-reset">🗑 清空重置</button>' +
        '</div>' +
        '<input type="file" id="meFile" accept=".json,application/json" style="display:none">' +
      '</div>' +

      '<div class="sect"><h3>关于</h3></div>' +
      '<div class="card pad small muted">' +
        '<p><b>满分英语 · 河南专升本版</b> v1.0 —— 从高考 50 分到专升本英语 150 分的完整学习路径。</p>' +
        '<p>试卷结构参考近年河南专升本公共英语真题（阅读 40 / 完形 20 / 判断 10 / 英译汉 10 / 选词 15 / 汉译英 15 / 改错 20 / 写作 20）。本应用题库为学习型模拟内容，用于日常训练。</p>' +
        '<p>提示：iPad 上点「分享 → 添加到主屏幕」即可全屏使用；应用支持离线打开（需先在线打开过一次）。</p>' +
      '</div>';
  }

  function stat(ico, k, v, unit, _) {
    return '<div class="card stat-card"><div class="k">' + ico + ' ' + k + '</div><div class="v">' + v + '<small> ' + unit + '</small></div></div>';
  }
  function oneBar(name, v, max, color) {
    var pct = Math.min(100, max ? Math.round(v / max * 100) : 0);
    return '<div class="mt12"><div class="row"><span class="small muted">' + name + '</span><span class="small" style="margin-left:auto;font-weight:700">' + v + '/' + max + '</span></div>' +
      '<div class="pbar thin mt4"><i style="width:' + pct + '%;background:' + color + '"></i></div></div>';
  }
  function goalCtl(name, val, opts, act) {
    return '<div style="flex:1;min-width:140px"><div class="small muted" style="font-weight:700">' + name + '</div>' +
      '<div class="row mt8 wrap" style="gap:6px">' + opts.map(function (o) {
        return '<button class="btn xs ' + (val === o ? 'soft' : 'ghost') + '" data-act="' + act + '" data-v="' + o + '">' + o + '</button>';
      }).join('') + '</div></div>';
  }

  /* ---------- 动作 ---------- */
  Eng.actions['me-name'] = function () {
    Eng.modal(
      '<div class="mt12"><input class="inp" id="meNameInp" maxlength="12" placeholder="你的称呼" value="' + esc(Eng.S.user.name || '') + '"></div>' +
      '<button class="btn block mt16" data-act="me-name-save">保存</button>', { title: '✏️ 修改称呼' });
    setTimeout(function () { var el = document.getElementById('meNameInp'); if (el) el.focus(); }, 60);
  };
  Eng.actions['me-name-save'] = function () {
    var el = document.getElementById('meNameInp');
    if (el && el.value.trim()) Eng.S.user.name = el.value.trim();
    Eng.closeModal(); Eng.save(); Eng.go('me');
  };
  Eng.actions['me-gw'] = function (el, d) { Eng.S.set.goalW = +d.v; Eng.save(); Eng.go('me'); };
  Eng.actions['me-gq'] = function (el, d) { Eng.S.set.goalQ = +d.v; Eng.save(); Eng.go('me'); };
  Eng.actions['me-gm'] = function (el, d) { Eng.S.set.goalMin = +d.v; Eng.save(); Eng.go('me'); };

  Eng.actions['me-export'] = function () {
    var blob = new Blob([Eng.exportData()], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '满分英语-备份-' + E.dateKey() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 300);
    Eng.toast('✅ 备份已导出');
  };
  Eng.actions['me-import'] = function () {
    document.getElementById('meFile').click();
    var f = document.getElementById('meFile');
    f.onchange = function () {
      var file = f.files[0];
      if (!file) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          Eng.importData(rd.result);
          Eng.toast('✅ 备份导入成功');
          Eng.go('me');
        } catch (err) {
          Eng.toast('⚠️ 文件格式不正确');
        }
      };
      rd.readAsText(file);
    };
  };
  Eng.actions['me-reset'] = function () {
    Eng.modal(
      '<p class="small muted mt8">将清空本机全部学习记录、词汇进度与成绩，且不可恢复（建议先导出备份）。</p>' +
      '<div class="row mt16" style="gap:10px"><button class="btn ghost grow" data-close>取消</button>' +
      '<button class="btn bad grow" data-act="me-reset-yes">确认清空</button></div>',
      { title: '⚠️ 清空所有数据？' });
  };
  Eng.actions['me-reset-yes'] = function () {
    Eng.closeModal();
    Eng.resetAll();
    // 重置模块内存态
    try { g.Eng && g.Eng.go && g.Eng.go('me'); } catch (e) { location.reload(); }
    Eng.toast('已重置，重新开始吧 🌱');
  };
})(window);
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () { window.Eng.start(); });
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
